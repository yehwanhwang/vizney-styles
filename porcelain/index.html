<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Porcelain · 호텔 운영 샘플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@v3.3.0/css/SpoqaHanSansNeo.css">
<script src="/lib/embed.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f6fa}
.vz{
  --bg:#f5f6fa;--card:#fff;
  --ink-strong:#2f3546;--ink:#3d4257;--ink-2:#6b7387;--muted:#8a92a3;
  --hair:#eef1f5;--hair-2:#e3e7ee;
  --blue:#2d94f0;--blue-text:#1a6fcf;--blue-track:#dbe9fc;
  --green:#27cf8e;--green-text:#0a7f51;--green-big:#0f9a63;--green-soft:#e5f8ef;--green-track:#d3f2e4;
  --amber:#eaa20e;--coral:#f25f5c;--coral-text:#b3352f;--coral-soft:#feeceb;
  --shadow:0 1px 2px rgba(35,48,77,.04),0 3px 10px rgba(35,48,77,.045);
  --shadow-hover:0 14px 34px rgba(35,48,77,.11),0 3px 8px rgba(35,48,77,.05);
  --r:6px;--pad:28px;--gap:16px;
  color-scheme:light;
  font-family:"Spoqa Han Sans Neo","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;min-height:100vh;word-break:keep-all;
}
.vz button{font:inherit}
.vz :focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

/* ---------- side rail ---------- */
.vz-side{width:88px;flex:none;align-self:stretch;background:#fff;box-shadow:1px 0 0 #edf0f5}
.vz-side-in{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;padding:30px 0}
.vz-logo{display:grid;place-items:center;width:44px;height:44px;margin-bottom:30px}
.vz-nav{display:flex;flex-direction:column;gap:12px}
.vz-nav span{width:48px;height:48px;display:grid;place-items:center;border-radius:10px;color:var(--blue)}
.vz-nav span.on{box-shadow:0 6px 18px rgba(36,72,140,.14)}
.vz-nav svg{width:22px;height:22px}

/* ---------- main ---------- */
.vz-main{flex:1;min-width:0;padding:24px 28px 28px}
.vz-wrap{max-width:1480px;margin:0 auto}
.vz-top{display:flex;align-items:center;gap:18px;min-height:64px;padding:10px 18px 10px 26px;margin-bottom:var(--gap);background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.vz-title{margin:0;font-size:15px;font-weight:500;color:var(--ink-strong);white-space:nowrap;padding-right:20px;border-right:1px solid var(--hair-2);line-height:22px}
.vz-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.vz-tabs::-webkit-scrollbar{display:none}
.vz-tab{appearance:none;border:0;background:none;font-size:14px;color:var(--ink-2);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.vz-tab:hover{color:var(--ink-strong)}
.vz-tab[aria-pressed="true"]{color:var(--blue-text);font-weight:500}
.vz-tools{margin-left:auto;display:flex;align-items:center;gap:16px}
.vz-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.vz-chip svg{color:var(--muted)}
.vz-lang{display:inline-flex;padding:3px;border-radius:999px;background:#f1f3f8}
.vz-lang button{appearance:none;border:0;background:none;font-size:12px;font-weight:500;color:var(--ink-2);padding:4px 10px;border-radius:999px;cursor:pointer;letter-spacing:.02em}
.vz-lang button[aria-pressed="true"]{background:#fff;color:var(--ink-strong);box-shadow:0 1px 3px rgba(35,48,77,.14)}
.vz-sep{width:1px;height:30px;background:var(--hair-2)}
.vz-bell{position:relative;display:grid;place-items:center;color:var(--blue)}
.vz-bell::after{content:"";position:absolute;top:0;right:0;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.vz-user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);white-space:nowrap}
.vz-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2d94f0,#27cf8e);letter-spacing:.03em}

/* ---------- grid ---------- */
.vz-grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr));grid-template-areas:
  "occ occ occ occ dir dir dir dir dir nps nps nps"
  "rev rev rev gst gst gst cal cal cal cal cal cal"
  "chn chn chn nat nat nat cal cal cal cal cal cal"}
.a-occ{grid-area:occ}.a-dir{grid-area:dir}.a-nps{grid-area:nps}.a-cal{grid-area:cal}
.a-rev{grid-area:rev}.a-gst{grid-area:gst}.a-chn{grid-area:chn}.a-nat{grid-area:nat}

.card{position:relative;min-width:0;container-type:inline-size;display:flex;flex-direction:column;padding:var(--pad);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);transition:box-shadow .25s ease}
@media (hover:hover){.card:hover{box-shadow:var(--shadow-hover)}}
.card-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;min-height:22px;margin-bottom:18px}
.card-t{margin:0;font-size:15px;font-weight:500;line-height:22px;color:var(--ink-strong)}
.aside{font-size:12px;color:var(--ink-2)}

/* figures */
.kpi{font-size:36px;line-height:1.1;font-weight:400;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.kpi .u{font-size:15px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:3px}
.kpi .u.pre{margin:0 2px 0 0}
.kpis{display:flex;flex-wrap:wrap;gap:12px 44px}
.lbl{font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.delta{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.delta b{font-weight:700;color:var(--green-text);margin-right:5px}
.delta b.neg{color:var(--coral-text)}

/* legends */
.lgs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.lg b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.lg .u{font-size:.92em;font-weight:400;color:var(--ink-2);margin-left:1px}
.lg .u.pre{margin:0 1px 0 0}
.k-dot{width:9px;height:9px;flex:none;border-radius:50%;border:2px solid var(--c)}
.k-dot.solid{background:var(--c)}
.k-sq{width:9px;height:9px;flex:none;border-radius:2px;background:var(--c)}
.k-line{width:16px;height:0;flex:none;border-top:2px solid var(--c);border-radius:2px}
.k-line.dotted{border-top-style:dotted}
.k-none{width:16px;flex:none}

/* charts */
.chart{position:relative;flex:1 1 auto;min-height:150px}
.chart>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
.chart-occ{margin:10px calc(var(--pad) * -1) -14px}
.chart-dir{margin-top:14px;margin-bottom:-8px;min-height:170px}
.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ax.em{fill:var(--ink-2)}

/* tooltip */
.tip{position:absolute;z-index:6;left:0;top:0;pointer-events:none;background:#fff;border:1px solid var(--hair-2);border-radius:6px;padding:8px 11px 9px;box-shadow:0 8px 22px rgba(35,48,77,.13);white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .14s ease,transform .14s ease}
.tip.on{opacity:1;transform:none}
.tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:0;width:9px;height:9px;background:#fff;border-right:1px solid var(--hair-2);border-bottom:1px solid var(--hair-2);transform:translate(-50%,50%) rotate(45deg)}
.tip.below::after{bottom:auto;top:0;transform:translate(-50%,-50%) rotate(225deg)}
.tip-h{font-size:11px;color:var(--ink-2);margin-bottom:3px}
.tip-r{display:flex;align-items:center;gap:7px;line-height:1.55}
.tip-r b{font-size:13.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tip-r span{font-size:11.5px;color:var(--ink-2)}
[data-v=gauge]:focus-visible,[data-v=ring]:focus-visible{outline-offset:4px;border-radius:50%}
.stack:focus-visible{outline-offset:4px}
.tip-n{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--ink-2)}

/* gauge (NPS) */
.gauge-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.gauge{position:relative;width:min(208px,100%);aspect-ratio:208/160}
.gauge>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gauge-c{position:absolute;left:0;right:0;top:31%;display:flex;flex-direction:column;align-items:center;gap:4px}
.gauge-c .kpi{line-height:1}
.grade{font-size:13px;font-weight:700;line-height:1.4;color:var(--ink);margin-top:4px}
.grade.g3,.grade.g4{color:var(--green-text)}
.grade.g0{color:var(--coral-text)}
.nps-foot{margin-top:4px;font-size:12px;line-height:1.5;color:var(--ink-2);text-align:center}
.nps-foot b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}

/* rings */
.ring-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring{position:relative;width:148px;height:148px}
.ring>svg{display:block;width:148px;height:148px}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:2px}
.ring-c .kpi{font-size:28px;line-height:1.1}
.ring-c .kpi .u{font-size:13px}
.ring-c .cap{font-size:12px;color:var(--ink-2);margin-top:3px}
.ring-ico{display:block;margin-bottom:6px}
.ring-foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:18px}
@container (max-width:249px){.ring-foot{flex-direction:column;align-items:flex-start;gap:6px}}

/* calendar heatmap */
.cal{flex:1;display:flex;flex-direction:column;container-type:inline-size}
.cal-wd,.cal-grid,.cal-bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd span{font-size:11px;color:var(--muted);text-align:center;padding-bottom:8px}
.cal-grid{flex:1;grid-auto-rows:minmax(54px,1fr);border-radius:8px}
.cal-cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;border-radius:6px;background:#f2f5f9;transition:background-color .5s ease,color .5s ease;cursor:default;user-select:none}
.cal-cell.out{background:#f7f8fb}
.cal-d{font-size:11px;line-height:1;opacity:.8}
.cal-v{align-self:flex-end;font-size:13px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.cal-cell.hol::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff}
.cal-cell.hi{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink-strong)}
.cal-avg{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair)}
.cal-avg-h{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.cal-avg-h b{font-weight:500;color:var(--ink)}
.cal-bars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:66px}
.cal-bars span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal-bars i{display:block;width:10px;border-radius:4px 4px 0 0;background:var(--blue);transition:height .5s ease}
.scale{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.scale i{width:76px;height:8px;border-radius:4px;background:linear-gradient(90deg,#eef5fe,#d3e6fc 25%,#a6cdf8 50%,#68a8f1 75%,#2480e2)}
@container (max-width:440px){
  .cal-v{display:none}
  .cal-grid{grid-auto-rows:minmax(40px,1fr)}
  .cal-cell{padding:6px}
  .cal-cell.hol::after{top:5px;right:5px;width:6px;height:6px}
}

/* lists */
.stack{display:flex;gap:2px;height:8px;margin:16px 0 6px}
.stack i{display:block;flex:1 1 0;min-width:3px;transition:flex-grow .6s ease,opacity .2s ease}
.stack i:first-child{border-radius:4px 0 0 4px}
.stack i:last-child{border-radius:0 4px 4px 0}
.stack.dim i:not(.on){opacity:.28}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair);font-size:13px;transition:opacity .2s ease}
.rows li:first-child{border-top:0}
.rows li.dim{opacity:.42}
.rows .nm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ink);white-space:nowrap}
.rows .val{font-weight:500;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .val .u{font-size:.92em;font-weight:400;color:var(--ink-2);margin-left:1px}
.rows .pct{width:38px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.nat li{padding:11px 0}
.bdg{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:58px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.bdg svg{width:11px;height:11px}
.bdg.up{background:var(--green-soft);color:var(--green-text)}
.bdg.down{background:var(--coral-soft);color:var(--coral-text)}
.a-chn .kpi{margin-top:0}

/* footer */
.vz-foot{margin:18px 4px 0;font-size:12px;color:var(--ink-2)}

/* ---------- embed (블로그 iframe, ?embed=1 · lib/embed.js) ---------- */
html.vz-embed .vz{min-height:0}
html.vz-embed .vz-foot{display:none}

.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* motion */
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.4,.1,.2,1) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0}}
.arc{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)}
.knob{transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.vz *,.vz *::before,.vz *::after{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1359px){
  .vz{--pad:24px;--gap:14px}
  .vz-side{width:72px}
  .vz-main{padding:20px}
}
@media (max-width:1179px){
  .vz-side{width:72px}
  .vz-user .nm{display:none}
  .vz-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"occ nps" "dir dir" "rev gst" "cal cal" "chn nat"}
}
@media (max-width:1023px){
  .vz-top{flex-wrap:wrap;gap:8px 14px;padding:12px 16px 10px 22px}
  .vz-title{border-right:0;padding-right:0}
  .vz-tabs{order:3;flex-basis:100%;margin:0 -12px}
}
@media (max-width:899px){
  .vz-side{display:none}
  .vz-main{padding:16px}
  .vz-bell,.vz-sep{display:none}
}
@media (max-width:639px){
  .vz{--pad:20px;--gap:12px}
  .vz-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"occ" "dir" "nps" "rev" "gst" "cal" "chn" "nat"}
  .vz-top{padding:12px 14px 10px}
  .vz-tabs{margin:0 -8px}
  .vz-tab{padding:8px 10px}
  .vz-tools{gap:10px}
  .vz-chip,.vz-user .nm{display:none}
  .kpi{font-size:32px}
}
</style>
</head>
<body>
<div class="vz" id="vz">
  <aside class="vz-side" aria-hidden="true"><div class="vz-side-in">
    <div class="vz-logo">
      <svg width="30" height="30" viewBox="0 0 30 30"><path d="M7.5 25V13.5a7.5 7.5 0 0 1 15 0V25" fill="none" stroke="#27cf8e" stroke-width="3.2" stroke-linecap="round"/><circle cx="15" cy="17" r="2.7" fill="#2d94f0"/><path d="M4 25.5h22" stroke="#2d94f0" stroke-width="3.2" stroke-linecap="round"/></svg>
    </div>
    <nav class="vz-nav">
      <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 15.5l3.2-3.4 2.8 2.1 4-4.7"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5V6.5M3 14h18v4.5M21 14v-2.5A3.5 3.5 0 0 0 17.5 8H11v6"/><circle cx="7" cy="11" r="2"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M15.5 5.6a3 3 0 0 1 0 5.8M17.6 14.3c1.7.6 2.7 2.2 3 4.7"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>
    </nav>
  </div></aside>

  <div class="vz-main"><div class="vz-wrap">
    <header class="vz-top">
      <h1 class="vz-title" data-i18n="title"></h1>
      <nav class="vz-tabs">
        <button class="vz-tab" type="button" data-branch="all"></button>
        <button class="vz-tab" type="button" data-branch="ss"></button>
        <button class="vz-tab" type="button" data-branch="hn"></button>
        <button class="vz-tab" type="button" data-branch="jj"></button>
      </nav>
      <div class="vz-tools">
        <span class="vz-chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-i18n="period"></span></span>
        <div class="vz-lang" role="group" aria-label="Language"><button type="button" data-lang="ko">KO</button><button type="button" data-lang="en">EN</button></div>
        <span class="vz-sep" aria-hidden="true"></span>
        <span class="vz-bell" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span>
        <span class="vz-user"><span class="nm" data-i18n="role"></span><span class="vz-avatar" aria-hidden="true">RM</span></span>
      </div>
    </header>

    <main class="vz-grid">
      <!-- 객실 점유율 -->
      <section class="card a-occ" id="c-occ">
        <div class="card-h">
          <h2 class="card-t" data-i18n="occ.t"></h2>
          <div class="lgs">
            <span class="lg"><i class="k-line" style="--c:#2d94f0"></i><span data-i18n="occ.s1"></span></span>
            <span class="lg"><i class="k-line dotted" style="--c:#aeb6c4"></i><span data-i18n="occ.s2"></span></span>
          </div>
        </div>
        <div class="lbl" data-i18n="occ.lbl"></div>
        <div class="kpi" data-v="kpi"></div>
        <div class="delta" data-v="delta"></div>

      d += `C${(x0 + k).toFixed(1)},${(y0 + t[i] * k).toFixed(1)} ${(x1 - k).toFixed(1)},${(y1 - t[i + 1] * k).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;

  /* ---------- tooltip ---------- */
  function tipNodes(title, rows, note) {

    rows.forEach(r => out.push(h('div', { class: 'tip-r' },
      r.key ? h('i', { class: 'k-line' + (r.dotted ? ' dotted' : ''), style: { '--c': r.key } }) : h('i', { class: 'k-none' }),
      h('b', { text: r.value }), r.label ? h('span', { text: r.label }) : null)));

  function showTip(card, nodes, ax, ayTop, ayBottom) {
    const tip = $('.tip', card);
    tip.replaceChildren(...nodes);
    tip.classList.add('on');
    const cw = card.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = Math.round(Math.max(8, Math.min(cw - tw - 8, ax - tw / 2)));
    let top = Math.round(ayTop - th - 11), below = false;
    if (top < 4) { top = Math.round((ayBottom == null ? ayTop : ayBottom) + 11); below = true; }
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.setProperty('--ax', Math.max(12, Math.min(tw - 12, ax - left)) + 'px');
    tip.classList.toggle('below', below);
  }

  const announce = card => { const tip = $('.tip', card), live = $('#live'); if (live && tip.classList.contains('on')) live.textContent = tip.innerText.replace(/\s*\n+\s*/g, ', '); };
  // arrow keys step, Home/End jump, Esc clears; returns the new index or null when the key is not ours
  function keyStep(e, cur, n, rowLen) {
    const k = e.key;
    let i = null;
    if (k === 'ArrowRight') i = cur + 1;
    else if (k === 'ArrowLeft') i = cur - 1;
    else if (rowLen && k === 'ArrowDown') i = cur + rowLen;
    else if (rowLen && k === 'ArrowUp') i = cur - rowLen;
    else if (k === 'Home') i = 0;
    else if (k === 'End') i = n - 1;
    else if (k === 'Escape') i = -1;

      const rg = document.createRange(); rg.selectNodeContents(el);

    });
  }

  function fillTable(table, caption, head, rows) {

      h('caption', { text: caption }),
      h('thead', null, h('tr', null, head.map(x => h('th', { scope: 'col', text: x })))),
      h('tbody', null, rows.map(r => h('tr', null, r.map((c, j) => h(j ? 'td' : 'th', j ? { text: c } : { scope: 'row', text: c }))))));
  }

  /* ---------- data view (branch or all) ---------- */
  function getView(key) {
    const bs = key === 'all' ? Object.values(DATA.branches) : [DATA.branches[key]];
    const rooms = sum(bs.map(b => b.rooms)), n = DATA.months.length;
    const wavg = f => DATA.months.map((_, i) => sum(bs.map(b => f(b)[i] * b.rooms)) / rooms);
    const sold = bs[0].sold.map((_, d) => sum(bs.map(b => b.sold[d])));
    const rn = sum(sold);
    const occ = wavg(b => b.occ);
    occ[n - 1] = rn / (rooms * sold.length) * 100;
    const nat = {};
    bs.forEach(b => b.nat.forEach(r => { const m = nat[r.code] || (nat[r.code] = { code: r.code, sep: 0, aug: 0 }); m.sep += r.sep; m.aug += r.aug; }));
    return {
      rooms, occ, prev: wavg(b => b.prev), sold, rn,
      daily: sold.map(s => s / rooms * 100),
      direct: DATA.months.map((_, i) => sum(bs.map(b => b.direct[i]))),
      nps: { p: sum(bs.map(b => b.nps.promoters)), n: sum(bs.map(b => b.nps.passives)), d: sum(bs.map(b => b.nps.detractors)) },
      nat: Object.values(nat).sort((a, b) => b.sep - a.sep).slice(0, 5),
      revenue: sum(bs.map(b => b.revenue)), target: sum(bs.map(b => b.target)),
      guests: sum(bs.map(b => b.guests)), returning: sum(bs.map(b => b.returning)),

  }

  /* ---------- 객실 점유율 : smooth line ---------- */
  function drawOcc(v, animate) {
    const card = $('#c-occ'), box = $('[data-chart=occ]', card), t = L();
    const W = Math.round(box.clientWidth), H = Math.round(box.clientHeight);
    if (!W || !H) return;
    box._w = W; box._h = H;
    const n = v.occ.length, padL = 22, padR = 26, top = 12, axisH = 30, bottom = H - axisH;
    const all = v.occ.concat(v.prev);
    const y0 = Math.floor((Math.min(...all) - 3) / 5) * 5, y1 = Math.ceil((Math.max(...all) + 2) / 5) * 5;
    const step = (W - padL - padR) / (n - 1);

    const A = v.occ.map((val, i) => [X(i), Y(val)]), B = v.prev.map((val, i) => [X(i), Y(val)]);
    const peak = v.occ.indexOf(Math.max(...v.occ));

    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: 0,
      'aria-label': t.occ.aria(nf(v.occ[n - 1], 1), monLong(peak), nf(v.occ[peak], 1)) });
    const cross = sv('line', { y1: top - 2, y2: bottom + 2, stroke: C.hair2, 'stroke-width': 1 });
    svg.append(cross);
    svg.append(sv('path', { d: smooth(B), fill: 'none', stroke: C.prev, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-dasharray': '0.1 5', class: animate ? 'fade' : null }));
    svg.append(sv('path', { d: smooth(A), fill: 'none', stroke: C.blue, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: animate ? 1 : null, class: animate ? 'draw' : null }));
    svg.append(sv('circle', { cx: A[n - 1][0], cy: A[n - 1][1], r: 4.5, fill: '#fff', stroke: C.blue, 'stroke-width': 2 }));
    const dotB = sv('circle', { r: 3.5, fill: C.prev, stroke: '#fff', 'stroke-width': 2 });

    svg.append(hl);

    svg.append(sv('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' }));
    box.replaceChildren(svg);

    let cur = peak;
    const set = (i, quiet) => {
      cur = i;
      const [x, ya] = A[i], yb = B[i][1];
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);

    svg.addEventListener('pointerenter', () => { hovering = true; });
    svg.addEventListener('pointerleave', () => { hovering = false; });
    svg.addEventListener('focus', () => { hovering = true; });
    svg.addEventListener('blur', () => { hovering = false; });
    const idxAt = cx => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.round((cx - r.left - padL) / step))); };
    svg.addEventListener('pointermove', e => { const i = idxAt(e.clientX); if (i !== cur) set(i); });
    svg.addEventListener('pointerdown', e => set(idxAt(e.clientX)));

    else set(peak);

    const card = $('#c-rev'), t = L(), ach = v.revenue / v.target, adr = v.revenue / v.rn;
    setRing(card, ach);
    fillFig($('[data-v=val]', card), moneyParts(v.revenue));
    $('[data-v=cap]', card).textContent = t.rev.of(nf(ach * 100));
    $('[data-v=foot]', card).replaceChildren(legendItem(C.blue, t.rev.rev, moneyParts(v.revenue)), legendItem('#b9d4f7', t.rev.target, moneyParts(v.target)));
    const ring = $('[data-v=ring]', card);
    ring.setAttribute('role', 'img');
    ring.setAttribute('aria-label', `${t.rev.t} ${partsText(moneyParts(v.revenue))}, ${t.rev.of(nf(ach * 100))}`);
    const adrText = state.lang === 'ko' ? `${nf(Math.round(adr / 100) * 100)}원` : `₩${nf(Math.round(adr / 100) * 100)}`;
    ring._tip = () => tipNodes(null, [
      { key: C.blue, value: partsText(moneyParts(v.revenue)), label: t.rev.rev },
      { key: '#b9d4f7', value: partsText(moneyParts(v.target)), label: t.rev.target },
      { value: adrText, label: t.rev.adr }
    ]);
    fillTable($('[data-v=table]', card), t.rev.t, t.rev.th, [[t.rev.rev, partsText(moneyParts(v.revenue))], [t.rev.target, partsText(moneyParts(v.target))],
      [t.rev.ach, nf(ach * 100) + '%'], [t.rev.adr, adrText]]);
  }
  function renderGst(v) {
    const card = $('#c-gst'), t = L(), ret = v.returning, neu = v.guests - v.returning, rate = ret / v.guests;
    setRing(card, rate);
    fillFig($('[data-v=val]', card), countParts(v.guests, t.gst.unit));
    $('[data-v=cap]', card).textContent = t.gst.cap(nf(rate * 100));
    $('[data-v=foot]', card).replaceChildren(legendItem(C.green, t.gst.ret, compactParts(ret, t.gst.unit)), legendItem('#a9e4c9', t.gst.neu, compactParts(neu, t.gst.unit)));
    const ring = $('[data-v=ring]', card);
    ring.setAttribute('role', 'img');
    ring.setAttribute('aria-label', `${t.gst.t} ${nf(v.guests)}, ${t.gst.cap(nf(rate * 100))}`);
    ring._tip = () => tipNodes(null, [
      { key: C.green, value: partsText(countParts(ret, t.gst.unit)), label: `${t.gst.ret} ${nf(rate * 100)}%` },
      { key: '#a9e4c9', value: partsText(countParts(neu, t.gst.unit)), label: `${t.gst.neu} ${nf((1 - rate) * 100)}%` }
    ]);
    fillTable($('[data-v=table]', card), t.gst.t, t.gst.th, [[t.gst.ret, nf(ret), nf(rate * 100) + '%'], [t.gst.neu, nf(neu), nf((1 - rate) * 100) + '%'],
      [t.gst.total, nf(v.guests), '100%']]);
  }

  /* ---------- 일별 점유율 calendar heatmap ---------- */
  const cal = { cells: [], cur: 0 };
  function buildCal() {
    const card = $('#c-cal'), grid = $('[data-v=grid]', card);
    for (let k = 0; k < 35; k++) {
      const d = k - FIRST_WD + 1;
      if (d < 1 || d > 30) { grid.append(h('div', { class: 'cal-cell out', 'aria-hidden': 'true' })); continue; }
      const cell = h('div', { class: 'cal-cell' + (DATA.chuseok.includes(d) ? ' hol' : ''), 'data-d': d },
        h('span', { class: 'cal-d', text: d }), h('span', { class: 'cal-v' }));
      grid.append(cell);
      cal.cells[d] = cell;
    }
    const bars = $('[data-v=bars]', card);
    for (let w = 0; w < 7; w++) bars.append(h('div', null, h('span'), h('i')));

    const show = d => {
      cal.cells.forEach((c, i) => c && c.classList.toggle('hi', i === d));
      cal.cur = d;
      if (!d) { hideTip(card); return; }
      const v = state.view, t = L(), cell = cal.cells[d], o = offsetIn(card, cell);
      const w = t.cal.wd[(FIRST_WD + d - 1) % 7];
      showTip(card, tipNodes(t.cal.date(d, w), [
        { key: rgbCss(rampColor(v.daily[d - 1])), value: nf(v.daily[d - 1], 1) + '%', label: t.cal.occ },
        { value: t.cal.rooms(nf(v.sold[d - 1]), nf(v.rooms)), label: t.cal.sold }
      ], DATA.chuseok.includes(d) ? { color: C.green, text: t.cal.chuseok } : null), o.x + o.w / 2, o.y - 2, o.y + o.h + 2);
    };
    grid.addEventListener('pointerover', e => { const c = e.target.closest('.cal-cell[data-d]'); if (c) show(+c.dataset.d); });
    grid.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') show(0); });
    card._reset = () => show(0);
    grid.addEventListener('focus', () => { if (!cal.cur) show(1); });
    grid.addEventListener('blur', () => show(0));
    grid.addEventListener('keydown', e => {
      const i = keyStep(e, cal.cur ? cal.cur - 1 : 0, 30, 7);
      if (i === null) return;
      show(i < 0 ? 0 : i + 1); if (i >= 0) announce(card);
    });
  }
  function renderCal(v) {
    const card = $('#c-cal'), t = L();
    v.daily.forEach((o, i) => {
      const c = cal.cells[i + 1], rgb = rampColor(o);
      c.style.backgroundColor = rgbCss(rgb);
      c.style.color = inkOn(rgb);
      c.lastChild.textContent = Math.round(o) + '%';
      c.setAttribute('aria-label', `${t.cal.date(i + 1, t.cal.wd[(FIRST_WD + i) % 7])} ${nf(o, 1)}%`);
    });
    const s = Array(7).fill(0), k = Array(7).fill(0);
    v.daily.forEach((o, i) => { const w = (FIRST_WD + i) % 7; s[w] += o; k[w]++; });
    $$('[data-v=bars] > div', card).forEach((col, w) => {
      const avg = s[w] / k[w];
      col.firstChild.textContent = Math.round(avg) + '%';
      col.lastChild.style.height = Math.round(avg / 100 * 42) + 'px';
    });
    fillTable($('[data-v=table-wd]', card), t.cal.wdAvg, t.cal.thWd, t.cal.wd.map((w, i) => [w, nf(s[i] / k[i], 1) + '%']));
    $('[data-v=mavg]', card).replaceChildren(t.cal.mavg + ' ', h('b', { text: nf(v.occ[v.occ.length - 1], 1) + '%' }));
    $('[data-v=grid]', card).setAttribute('aria-label', t.cal.aria);
    fillTable($('[data-v=table]', card), t.cal.t, t.cal.th, v.daily.map((o, i) => [t.cal.date(i + 1, t.cal.wd[(FIRST_WD + i) % 7]), nf(o, 1) + '%', t.cal.rooms(nf(v.sold[i]), nf(v.rooms))]));
    if (cal.cur) { cal.cells[cal.cur].classList.remove('hi'); cal.cur = 0; hideTip(card); }
  }

  /* ---------- 예약 채널 ---------- */
  function renderChn(v, animate) {
    const card = $('#c-chn'), t = L();
    fillFig($('[data-v=rn]', card), countParts(v.rn, t.chn.unit));
    $$('[data-v=stack] i', card).forEach((seg, i) => { seg.style.flexGrow = String(v.channels[i]); seg.style.background = CH[i]; });
    $('[data-v=rows]', card).replaceChildren(...v.channels.map((val, i) => h('li', { 'data-i': i, class: animate ? 'fade' : null },
      h('span', { class: 'nm' }, h('i', { class: 'k-dot', style: { '--c': CH[i] } }), t.chn.names[i]),
      h('span', { class: 'val' }, figNodes(countParts(val, t.chn.unit))),
      h('span', { class: 'pct', text: nf(val / v.rn * 100) + '%' }))));
    $('[data-v=stack]', card).setAttribute('aria-label', t.chn.aria);
    fillTable($('[data-v=table]', card), t.chn.t, t.chn.th, v.channels.map((val, i) => [t.chn.names[i], partsText(countParts(val, t.chn.unit)), nf(val / v.rn * 100, 1) + '%']));
  }
  function bindChn() {
    const card = $('#c-chn'), stack = $('[data-v=stack]', card);
    const focus = i => {
      stack.classList.toggle('dim', i >= 0);
      $$('i', stack).forEach((s, k) => s.classList.toggle('on', k === i));
      $$('[data-v=rows] li', card).forEach((li, k) => li.classList.toggle('dim', i >= 0 && k !== i));
    };
    let cur = -1;
    const segTip = i => {
      const v = state.view, t = L(), el = $$('i', stack)[i], o = offsetIn(card, el);
      showTip(card, tipNodes(t.chn.names[i], [{ key: CH[i], value: partsText(countParts(v.channels[i], t.chn.unit)), label: nf(v.channels[i] / v.rn * 100, 1) + '%' }]), o.x + o.w / 2, o.y - 4, o.y + o.h + 4);
    };
    card.addEventListener('pointerover', e => {
      const el = e.target.closest('[data-i]');
      if (!el) return;
      const i = +el.dataset.i;
      focus(i);
      if (el.parentNode === stack) segTip(i); else hideTip(card);
    });
    stack.addEventListener('keydown', e => {
      const i = keyStep(e, cur < 0 ? 0 : cur, 4);
      if (i === null) return;
      cur = cur < 0 && i >= 0 && e.key !== 'Home' && e.key !== 'End' ? 0 : i;
      focus(cur);
      if (cur < 0) { hideTip(card); return; }
      segTip(cur); announce(card);
    });
    stack.addEventListener('focus', () => { cur = 0; focus(0); segTip(0); });
    stack.addEventListener('blur', () => { cur = -1; focus(-1); hideTip(card); });
    card.addEventListener('pointerout', e => {
      if (e.pointerType !== 'mouse') return;
      if (!e.relatedTarget || !card.contains(e.relatedTarget) || !e.relatedTarget.closest('[data-i]')) { focus(-1); hideTip(card); }
    });
    card._reset = () => { focus(-1); hideTip(card); };
  }

  /* ---------- 국적별 투숙객 ---------- */
  const ARROW_UP = 'M3 9L9 3M4.4 3H9V7.6', ARROW_DOWN = 'M3 3L9 9M9 4.4V9H4.4';
  function renderNat(v, animate) {
    const card = $('#c-nat'), t = L();
    $('[data-v=rows]', card).replaceChildren(...v.nat.map(r => {
      const chg = r.sep / r.aug - 1, up = chg >= 0;
      return h('li', { class: animate ? 'fade' : null },
        h('span', { class: 'nm', text: t.nat.names[r.code] }),
        h('span', { class: 'val' }, figNodes(countParts(r.sep, t.nat.unit))),
        h('span', { class: 'bdg ' + (up ? 'up' : 'down'), 'aria-label': `${t.nat.aside} ${nf(Math.abs(chg * 100), 1)}% ${up ? t.nat.up : t.nat.down}` },
          sv('svg', { viewBox: '0 0 12 12', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' },
            sv('path', { d: up ? ARROW_UP : ARROW_DOWN })),
          nf(Math.abs(chg * 100), 1) + '%'));
    }));
  }

  /* ---------- tooltips for figure cards ---------- */
  function bindFigureTips() {
    [['#c-nps', '[data-v=gauge]'], ['#c-rev', '[data-v=ring]'], ['#c-gst', '[data-v=ring]']].forEach(([cs, ts]) => {
      const card = $(cs), target = $(ts, card);
      const open = () => {
        if (!target._tip) return;
        const o = offsetIn(card, target);
        showTip(card, target._tip(), o.x + o.w / 2, o.y + 6, o.y + o.h);
      };
      target.addEventListener('pointerenter', open);
      target.addEventListener('pointerdown', open);
      target.addEventListener('focus', () => { open(); announce(card); });
      target.addEventListener('blur', () => hideTip(card));
      target.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(card); });
      target.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(card); });
      card._reset = () => hideTip(card);
    });
  }

  /* ---------- i18n + render ---------- */
  function applyLang() {
    const t = L();
    document.documentElement.lang = state.lang;
    document.title = t.docTitle;
    $$('[data-i18n]').forEach(e => { const val = e.dataset.i18n.split('.').reduce((o, k) => o && o[k], t); if (typeof val === 'string') e.textContent = val; });
    $('.vz-tabs').setAttribute('aria-label', t.tabsLabel);
    $$('.vz-tab').forEach(b => { b.textContent = t.tabs[b.dataset.branch]; b.setAttribute('aria-pressed', String(b.dataset.branch === state.branch)); });
    $$('.vz-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
    $('#c-cal [data-v=wd]').replaceChildren(...t.cal.wd.map(w => h('span', { text: w })));
  }
  function renderAll(animate) {
    const v = state.view = getView(state.branch);
    renderOcc(v, animate); renderDir(v, animate); renderNps(v); renderRev(v); renderGst(v);
    renderCal(v); renderChn(v, animate); renderNat(v, animate);
  }

  function init() {
    buildGauge();
    buildRing($('#c-rev'), C.blue, C.blueTrack);
    buildRing($('#c-gst'), C.green, C.greenTrack);
    buildCal(); bindChn(); bindFigureTips();
    applyLang();
    void document.body.offsetWidth; // commit empty arcs so the first sweep animates
    renderAll(true);

    $$('.vz-tab').forEach(b => b.addEventListener('click', () => {
      if (state.branch === b.dataset.branch) return;
      state.branch = b.dataset.branch; applyLang(); renderAll(true);
    }));
    $$('.vz-lang button').forEach(b => b.addEventListener('click', () => {
      if (state.lang === b.dataset.lang) return;
      state.lang = b.dataset.lang; applyLang(); renderAll(false);
    }));
    document.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      $$('.card').forEach(card => { if (card._reset && !card.contains(e.target)) card._reset(); });
    });
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(entries => {
        if (!state.view) return;
        entries.forEach(en => {
          const box = en.target, w = Math.round(box.clientWidth), hh = Math.round(box.clientHeight);
          if (w === box._w && hh === box._h) return;
          if (box.dataset.chart === 'occ') drawOcc(state.view, false);
          else drawDir(state.view, false);
        });
      });
      $$('[data-chart]').forEach(el => ro.observe(el));
    }
  }
  init();
})();
</script>
</body>
</html>
