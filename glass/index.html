<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Glass · 매출 현황 샘플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@v3.3.0/css/SpoqaHanSansNeo.css">
<script src="/lib/embed.js" defer></script>
<style>
  :root{
    --font:'Spoqa Han Sans Neo',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    --ink:#1D2142; --ink-2:#4B5075; --muted:#6A6F8C; --faint:#868BA5;
    --frame:rgba(255,255,255,.34); --frame-line:rgba(255,255,255,.78);
    --card:rgba(255,255,255,.64); --card-line:rgba(255,255,255,.92);
    --shadow:0 12px 32px rgba(107,88,186,.10);
    --c1:#3A78FF; --c2:#E87BA4; --c3:#EDA100; --other:#C5C8D7; --ly:#868BA5;
    --good:#0E7448; --bad:#B93232; --good-bg:rgba(14,116,72,.10); --bad-bg:rgba(185,50,50,.10);
    --hol:#BF4646; --hol-bg:rgba(255,107,107,.09);
    --tip:#1C2142;
    --big:28px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;font-family:var(--font);font-size:13px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word;
    background:
      radial-gradient(900px 620px at 4% 0%,#FFD5BF,rgba(255,213,191,0) 62%),
      radial-gradient(820px 640px at 100% 6%,#E5C8FF,rgba(229,200,255,0) 60%),
      radial-gradient(900px 700px at 86% 100%,#B8C8FF,rgba(184,200,255,0) 62%),
      radial-gradient(760px 560px at 8% 100%,#FFC6DA,rgba(255,198,218,0) 58%),
      linear-gradient(135deg,#FDE4D4 0%,#F4DBEE 45%,#DFD6FB 74%,#CBD6FB 100%);
  }
  button{font:inherit;color:inherit}
  svg{flex:none}
  .num{font-variant-numeric:tabular-nums}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :focus-visible{outline:2px solid var(--c1);outline-offset:3px}

  /* ---------- 배경과 유리 창 ---------- */
  .stage{position:relative;max-width:1440px;margin:0 auto;padding:44px 36px 40px}
  .orb{position:absolute;z-index:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.5) 36%,rgba(255,255,255,.14) 66%,rgba(255,255,255,0) 71%);
    box-shadow:inset -8px -12px 22px rgba(150,128,220,.2)}
  .app{position:relative;z-index:1;display:grid;grid-template-columns:78px minmax(0,1fr);
    background:var(--frame);border:1px solid var(--frame-line);border-radius:34px;
    box-shadow:0 40px 100px rgba(104,84,178,.18),inset 0 1px 0 rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%)}
  .rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 24px;
    border-right:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.22);border-radius:34px 0 0 34px}
  .brand{width:42px;height:42px;margin-bottom:22px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(140deg,#5C8DFF,#8F6BFF);box-shadow:0 10px 20px rgba(92,141,255,.35)}
  .brand svg{width:22px;height:22px}
  .brand--m{display:none}
  .nav{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--faint)}
  .nav svg,.chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav.on{color:#fff;background:linear-gradient(140deg,#4F8CFF,#3A6CFF);box-shadow:0 10px 20px rgba(58,108,255,.32)}
  .rail .grow{flex:1}
  .main{min-width:0;padding:28px 30px 24px}

  /* ---------- 머리글과 필터 ---------- */
  .top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:18px}
  .top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .top p{margin:6px 0 0;color:var(--muted)}
  .actions{display:flex;align-items:center;gap:10px}
  .chip{height:36px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.7);border:1px solid var(--card-line);color:var(--ink-2);font-weight:500}
  .chip svg{width:16px;height:16px}
  .lang{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--card-line)}
  .lang button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(80,70,150,.12)}
  .filters{display:flex;gap:8px;margin:0 0 18px;padding:2px;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .tab{flex:none;height:36px;padding:0 16px;border:1px solid var(--card-line);border-radius:12px;background:rgba(255,255,255,.42);
    color:var(--ink-2);font-weight:500;cursor:pointer;transition:background .15s,box-shadow .15s,color .15s}
  .tab:hover{background:rgba(255,255,255,.72)}
  .tab[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 6px 16px rgba(80,70,150,.14)}

  /* ---------- 카드 ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
  .card{position:relative;min-width:0;padding:20px 22px;background:var(--card);border:1px solid var(--card-line);border-radius:22px;
    box-shadow:var(--shadow);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
  .card.tip-on{z-index:3}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .kpi{grid-column:span 3}
  .trend{grid-column:span 8}
  .mix{grid-column:span 4}
  .heat{grid-column:span 7}
  .rank{grid-column:span 5}
  .head{margin-bottom:12px}
  .head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .head p{margin:4px 0 0;font-size:12px;color:var(--muted)}

  /* KPI: 글자 크기는 대표 수치(28px)와 나머지(13px) 두 가지만 쓴다 */
  .kpi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px}
  .kpi-tx{flex:none;min-width:0}
  .kpi-label{font-weight:500;color:var(--ink-2)}
  .kpi-val{display:flex;align-items:baseline;margin:6px 0 4px;white-space:nowrap}
  .kpi-val b{font-size:var(--big);font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .u{font-weight:500;color:var(--muted);margin-left:2px}
  .u.pre{margin:0 1px 0 0}
  .delta{display:flex;flex-direction:column;gap:1px}
  .delta b{font-weight:700}
  .delta.is-good b{color:var(--good)} .delta.is-bad b{color:var(--bad)}
  .delta span{color:var(--muted)}
  .kpi-val,.delta{transition:opacity .14s ease,transform .14s ease}
  .kpi.is-swap .kpi-val,.kpi.is-swap .delta{opacity:0;transform:translateY(3px)}
  .kpi-viz{position:relative;border-radius:10px;touch-action:pan-y}
  .spark{flex:0 1 160px;min-width:72px;height:54px}
  .spark svg{display:block;width:100%;height:100%;overflow:visible}
  .ring-viz{flex:none;text-align:center;padding:2px}
  .ring{position:relative;width:64px;height:64px;margin:0 auto}
  .ring svg{display:block;width:64px;height:64px;transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:700}
  .ring-cap{margin-top:4px;color:var(--muted)}

  /* 일별 추이 */
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:4px;font-size:12px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--c1)}
  .legend i.ly{border-top:2px dashed var(--ly)}
  .chart{position:relative;height:262px;border-radius:12px;touch-action:pan-y}
  .chart svg{display:block;width:100%;height:100%;overflow:visible}
  .chart text{font-family:var(--font);font-size:11px;fill:var(--faint);font-variant-numeric:tabular-nums}
  .chart text.hol{fill:var(--hol);font-weight:500}
  .note{display:flex;gap:8px;margin:10px 0 0;font-size:12px;line-height:1.55;color:var(--muted)}
  .note::before{content:"";flex:none;width:6px;height:6px;margin-top:6px;border-radius:50%;background:var(--hol)}

  /* 툴팁 */
  .tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .15s ease;
    padding:9px 12px 10px;border-radius:12px;background:var(--tip);color:#fff;font-size:12px;line-height:1.5;white-space:nowrap;
    box-shadow:0 14px 30px rgba(20,24,64,.28)}
  .tip.show{opacity:1}
  .tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-4px;width:10px;height:10px;border-radius:2px;background:inherit;transform:translateX(-50%) rotate(45deg)}
  .tip.below::after{bottom:auto;top:-4px}
  .tip.side-l::after,.tip.side-r::after{left:auto;bottom:auto;top:var(--ay,50%);transform:translateY(-50%) rotate(45deg)}
  .tip.side-l::after{right:-4px}
  .tip.side-r::after{left:-4px}
  .tip .tt{margin-bottom:3px;font-weight:700}
  .tip .tr{display:grid;grid-template-columns:16px auto auto;align-items:center;column-gap:8px}
  .tip.nokey .tr{grid-template-columns:auto auto}
  .tip .tr + .tr{margin-top:2px}
  .tip .key{width:16px;height:0;border-top:2px solid}
  .tip .key.dash{border-top-style:dashed}
  .tip .key.dot{width:8px;height:8px;border:0;border-radius:50%;justify-self:center}
  .tip .k{color:rgba(255,255,255,.62)}
  .tip .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .tip .up{color:#7FE3BD} .tip .dn{color:#FF9F9F}

  /* 채널 구성 */
  .donut{position:relative;width:188px;height:188px;margin:2px auto 14px;border-radius:50%}
  .donut svg{display:block;width:100%;height:100%}
  .donut.intro svg{animation:spin .9s cubic-bezier(.2,.8,.2,1) .25s both}
  @keyframes spin{from{opacity:0;transform:rotate(-70deg) scale(.94)}to{opacity:1;transform:none}}
  .arc{transition:opacity .2s,stroke-width .2s}
  .donut.has-focus .arc:not(.is-on){opacity:.25}
  .donut.has-focus .arc.is-on{stroke-width:19px}
  .dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .dc b{font-size:var(--big);font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .dc span{margin-top:2px;color:var(--muted)}
  .lg{display:grid;gap:2px}
  .lr{display:grid;grid-template-columns:10px minmax(0,1fr) auto 64px;align-items:center;gap:10px;padding:6px 2px;transition:opacity .2s}
  .lg.has-focus .lr:not(.is-on){opacity:.45}
  .lr .dot{width:10px;height:10px;border-radius:50%}
  .lr .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;color:var(--ink-2)}
  .lr .dd{text-align:right;font-size:12px;color:var(--muted)}

  /* 요일 × 시간대 */
  .hm{display:grid;grid-template-columns:30px repeat(12,minmax(0,1fr));gap:5px;align-items:center;border-radius:10px}
  .hm .yl{font-size:12px;color:var(--muted);white-space:nowrap}
  .hm .cell{height:26px;border-radius:7px;background:#E6EDFF;transition:background-color .45s ease,opacity .45s ease,transform .15s ease,box-shadow .15s ease}
  .hm .cell.peak{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(58,102,255,.5)}
  .hm .cell.is-on{position:relative;z-index:1;transform:scale(1.1);box-shadow:0 0 0 2px #fff,0 6px 14px rgba(58,102,255,.3)}
  .hm .xl{grid-column:span 2;padding-top:2px;font-size:11px;color:var(--faint)}
  .hm-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:16px;color:var(--ink-2)}
  .hm-foot b{color:var(--ink)}
  .hm-foot b,.hm-foot .nw{white-space:nowrap}
  .scale{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .scale i{display:block;width:92px;height:8px;border-radius:6px;background:linear-gradient(90deg,#E6EDFF,#9DBBFF,#2F62F5)}

  /* 카테고리 순위 */
  .rk{display:grid;gap:10px;margin:0 -6px;border-radius:10px}
  .rr{display:grid;grid-template-columns:16px minmax(0,1fr) auto 58px;align-items:center;column-gap:12px;row-gap:7px;padding:3px 6px;border-radius:10px;transition:opacity .2s,background-color .2s}
  .rk.has-focus .rr:not(.is-on){opacity:.45}
  .rr.is-on{background:rgba(255,255,255,.5)}
  .rr .no{font-weight:700;color:var(--faint)}
  .rr .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;color:var(--ink-2)}
  .rr .v{font-weight:700}
  .rr .v .u{margin-left:1px;font-size:12px}
  .chg{justify-self:end;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
  .chg.good{color:var(--good);background:var(--good-bg)}
  .chg.bad{color:var(--bad);background:var(--bad-bg)}
  .bar{grid-column:2/-1;height:8px;border-radius:0 4px 4px 0;background:rgba(58,120,255,.1)}
  .bar i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--c1);transition:width .48s cubic-bezier(.2,.8,.2,1)}
  .rk-foot{margin:16px 0 0;font-size:12px;color:var(--muted)}
  .foot{margin:18px 4px 0;text-align:right;font-size:12px;color:var(--muted);text-wrap:balance}
  .note,.rk-foot{text-wrap:pretty}

  /* ---------- 임베드 (블로그 iframe, ?embed=1 · lib/embed.js) ---------- */
  html.vz-embed body{min-height:0}
  html.vz-embed .foot{display:none}

  /* ---------- 반응형 ---------- */
  @media (max-width:1280px){
    .grid{grid-auto-flow:row dense}
    .kpi{grid-column:span 6}
  }
  @media (max-width:1100px){
    .trend,.heat{grid-column:span 12}
    .mix,.rank{grid-column:span 6}
  }
  @media (max-width:760px){
    .stage{padding:16px 12px 24px}
    .orb,.rail{display:none}
    .app{grid-template-columns:1fr;border-radius:26px}
    .main{padding:20px 14px 18px}
    .grid{gap:14px}
    .kpi,.trend,.mix,.heat,.rank{grid-column:span 12}
    .card{padding:16px}
    .top h1{font-size:20px}
    .brand--m{display:grid;width:34px;height:34px;margin-bottom:14px;border-radius:12px}
    .brand--m svg{width:18px;height:18px}
    .delta{flex-direction:row;flex-wrap:wrap;gap:0 6px}
    .hm{grid-template-columns:28px repeat(12,minmax(0,1fr));gap:3px}
    .hm .yl{font-size:11px}
    .foot{text-align:center}
    .hm .cell{height:24px;border-radius:5px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  const state = { lang: new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ko', seg: 'all' };

  /* ================= 숫자 표기 ================= */
  const f2 = n => Math.round(n * 100) / 100;

  const trim1 = x => { const r = Math.round(x * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };

  const signed = (v, dg) => (v >= 0 ? '+' : MINUS) + Math.abs(v).toFixed(dg);

  const money = v => state.lang === 'ko'
    ? (v >= 1e4 ? (v / 1e4).toFixed(1) + '억원' : nf(v) + '만원')

  const moneyParts = (v, ko = '억원') => state.lang === 'ko'
    ? (v >= 1e4 ? [{ t: (v / 1e4).toFixed(1) }, { t: ko, u: 1 }] : [{ t: nf(v) }, { t: ko === '억원' ? '만원' : '만', u: 1 }])
    : (v >= 1e5 ? [{ t: '₩', u: 1, pre: 1 }, { t: (v / 1e5).toFixed(2) }, { t: 'B', u: 1 }] : [{ t: '₩', u: 1, pre: 1 }, { t: nf(v / 100) }, { t: 'M', u: 1 }]);
  const count = v => state.lang === 'ko' ? nf(v) + '건' : nf(v);
  const aovText = v => state.lang === 'ko' ? (v / 1e4).toFixed(1) + '만원' : '₩' + (v / 1e3).toFixed(1) + 'K';
  const axisMoney = v => {
    if (v === 0) return '0';
    if (state.lang === 'ko') return v >= 1e4 ? trim1(v / 1e4) + '억' : v >= 1000 ? trim1(v / 1000) + '천만' : trim1(v) + '만';
    const won = v * 1e4;
    return won >= 1e9 ? trim1(won / 1e9) + 'B' : won >= 1e6 ? trim1(won / 1e6) + 'M' : trim1(won / 1e3) + 'K';
  };
  const DOW = { ko: ['일', '월', '화', '수', '목', '금', '토'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
  const dayLabel = i => { const w = DOW[state.lang][new Date(2026, 8, i + 1).getDay()]; return state.lang === 'ko' ? `9.${i + 1} (${w})` : `${w}, Sep ${i + 1}`; };
  const tickLabel = i => (state.lang === 'ko' ? '9.' : 'Sep ') + (i + 1);
  function setParts(el, parts) {

  /* ================= 공용: 곡선, 눈금, 툴팁, 알림 ================= */
  // 단조 3차 보간: 곡선이 실제 값보다 위아래로 튀지 않는다
  function smooth(pts) {
    const n = pts.length, dx = [], m = [], tg = [];
    for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
    tg[0] = m[0]; tg[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (m[i - 1] * m[i] <= 0) { tg[i] = 0; continue; }
      const w1 = 2 * dx[i] + dx[i - 1], w2 = dx[i] + 2 * dx[i - 1];
      tg[i] = (w1 + w2) / (w1 / m[i - 1] + w2 / m[i]);
    }
    let d = `M${f2(pts[0][0])},${f2(pts[0][1])}`;
    for (let i = 0; i < n - 1; i++) {
      const h = dx[i] / 3;
      d += `C${f2(pts[i][0] + h)},${f2(pts[i][1] + tg[i] * h)} ${f2(pts[i + 1][0] - h)},${f2(pts[i + 1][1] - tg[i + 1] * h)} ${f2(pts[i + 1][0])},${f2(pts[i + 1][1])}`;

  const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(s => s * p).find(s => s >= raw - 1e-9); };

  // 툴팁 내용은 textContent로만 채운다. rows: { key: 'line'|'dash'|'dot', color, label, value, cls }

  // (x, y)는 host 기준 좌표. 기본은 위쪽이고, 좌우 끝에서는 옆으로(clampX면 위쪽에 둔 채 안쪽으로 민다),

  }
  const live = $('#live');
  const announce = t => { live.textContent = t; };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  /* ================= KPI 카드 ================= */
  const KPIS = [
    { id: 'rev', better: 'up', kind: 'pct', cur: d => d.R, prev: d => d.RL, viz: 'ring' },
    { id: 'ord', better: 'up', kind: 'pct', cur: d => d.O, prev: d => d.ordLY, viz: 'spark', series: d => d.ord },
    { id: 'aov', better: 'up', kind: 'pct', cur: d => d.R * 1e4 / d.O, prev: d => d.RL * 1e4 / d.ordLY, viz: 'spark', series: d => d.aovD },
    { id: 'rr', better: 'down', kind: 'pp', cur: d => d.retTot / d.O * 100, prev: d => d.retLY / d.ordLY * 100, viz: 'spark', series: d => d.rateD }
  ];
  function kpiParts(k, d) {
    const v = k.cur(d), ko = state.lang === 'ko';

      (k.viz === 'ring'
        ? '<div class="kpi-viz ring-viz" tabindex="0" role="group"><div class="ring"><svg viewBox="0 0 68 68" aria-hidden="true">' +
          '<circle cx="34" cy="34" r="28" fill="none" stroke="rgba(58,120,255,.14)" stroke-width="7"/>' +
          `<circle class="ring-p" cx="34" cy="34" r="28" fill="none" stroke="${COLOR.c1}" stroke-width="7" stroke-linecap="round"/></svg><b></b></div><div class="ring-cap"></div></div>`

      dTxt: $('.delta b', card), dCap: $('.delta span', card), viz: $('.kpi-viz', card), tip: $('.tip', card),
      data: k.series ? k.series(DATA.all).slice() : null, hover: null, pinned: N - 1, active: false, stop: null

  }
  function computeDelta(k, d) {
    const cur = k.cur(d), prev = k.prev(d);
    const v = Math.round((k.kind === 'pct' ? pct(cur, prev) : cur - prev) * 10) / 10;
    const tone = (v >= 0) === (k.better === 'up') ? 'good' : 'bad';
    const txt = (v >= 0 ? '▲ ' : '▼ ') + Math.abs(v).toFixed(1) + (k.kind === 'pct' ? '%' : S().pp);
    const aria = (v >= 0 ? '+' : MINUS) + Math.abs(v).toFixed(1) + (k.kind === 'pct' ? '%' : S().pp);

  }
  function renderKpiText() {
    const d = DATA[state.seg];
    for (const k of KPIS) {
      const e = K[k.id], dl = computeDelta(k, d);
      e.label.textContent = S().kpi[k.id];

  function renderKpis(animate) {

    setTimeout(() => { renderKpiText(); for (const k of KPIS) K[k.id].card.classList.remove('is-swap'); }, 140);

  // 목표 달성 링
  const RG = { e: K.rev, val: 0, C: 2 * Math.PI * 28 };
  function drawRing() {
    const e = RG.e;

    p.style.strokeDasharray = f2(RG.C) + 'px';
    p.style.strokeDashoffset = f2(RG.C * (1 - Math.min(1, RG.val))) + 'px';
    $('.ring b', e.card).textContent = Math.round(RG.val * 100) + '%';

  }
  function showRingTip() {
    const d = DATA[state.seg], e = RG.e, s = S();
    fillTip(e.tip, s.ringTitle, [
      { label: s.target, value: money(d.target) },
      { label: s.actual, value: money(d.R) },
      { label: s.attain, value: Math.round(d.R / d.target * 100) + '%' }
    ]);

  }
  function tweenRing(intro) {

  }
  {
    const e = RG.e;

  // 스파크라인 (주문 수 · 객단가 · 반품률)
  function drawSpark(id) {
    const e = K[id], el = e.viz, svg = $('svg', el), W = el.clientWidth, H = el.clientHeight;
    if (!W || !H) return;
    const p = 5, vals = e.data, mn = Math.min(...vals), mx = Math.max(...vals);
    const X = i => p + (W - 2 * p) * i / (N - 1), Y = v => p + (H - 2 * p) * (1 - (v - mn) / (mx - mn || 1));
    const pts = vals.map((v, i) => [X(i), Y(v)]), d = smooth(pts), last = pts[N - 1];

    s += `<path d="${d}L${f2(last[0])},${H}L${f2(pts[0][0])},${H}Z" fill="url(#sg-${id})"/>`;

  }
  function tweenSparks() {
    for (const id of ['ord', 'aov', 'rr']) {

      if (e.stop) e.stop();
      e.stop = tween(480, t => { e.data = lerpArr(from, to, t); drawSpark(id); });
    }
  }
  for (const id of ['ord', 'aov', 'rr']) {
    const e = K[id], el = e.viz;
    const at = cx => { const r = el.getBoundingClientRect(); return clamp(Math.round((cx - r.left - 5) / ((r.width - 10) / (N - 1))), 0, N - 1); };
    // 마우스는 따라다니며 보여 주고, 누르거나 터치하면 그 날짜에 고정한다

  /* ================= 일별 매출 추이 ================= */
  const TR = { el: $('#trend'), svg: $('#trend svg'), tip: $('#trendTip'), data: { ty: DATA.all.rev.slice(), ly: DATA.all.revLY.slice() },

  function drawTrend(intro) {
    const W = TR.el.clientWidth, H = TR.el.clientHeight;

  const rowOf = e => { const rw = e.target.closest('.rr'); return rw ? +rw.dataset.c : null; };
  RK.el.addEventListener('pointerover', e => { const c = rowOf(e); if (c != null) { RK.hover = c; applyRankFocus(); } });
  RK.el.addEventListener('pointerdown', e => { const c = rowOf(e); if (c != null) { RK.focus = c; RK.active = true; applyRankFocus(); } });
  RK.el.addEventListener('pointerleave', e => { RK.hover = null; if (e.pointerType === 'mouse' && document.activeElement !== RK.el) RK.active = false; applyRankFocus(); });
  RK.el.addEventListener('focus', () => { RK.active = true; if (RK.focus == null) RK.focus = RK.order[0]; applyRankFocus(); });
  RK.el.addEventListener('blur', () => { RK.active = false; RK.hover = null; applyRankFocus(); });
  RK.el.addEventListener('keydown', e => {
    let pos = RK.order.indexOf(RK.focus == null ? RK.order[0] : RK.focus);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') pos++; else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') pos--;
    else if (e.key === 'Home') pos = 0; else if (e.key === 'End') pos = RK.order.length - 1;
    else if (e.key === 'Escape') { RK.active = false; applyRankFocus(); return; }
    else return;
    e.preventDefault();
    RK.focus = RK.order[clamp(pos, 0, RK.order.length - 1)]; RK.hover = null; RK.active = true; applyRankFocus();
    const d = DATA[state.seg], ci = RK.focus;
    announce(`${clamp(pos, 0, 4) + 1}. ${S().cats[ci]} · ${money(d.cat[ci])}, ${S().yoy} ${signed(pct(d.cat[ci], d.catLY[ci]), 0)}%`);
  });

  /* ================= 스크린 리더용 표 ================= */
  function table(caption, head, rows) {
    const t = document.createElement('table'), cap = document.createElement('caption');
    cap.textContent = caption; t.appendChild(cap);
    const tr = document.createElement('tr');
    for (const h of head) { const th = document.createElement('th'); th.scope = 'col'; th.textContent = h; tr.appendChild(th); }
    const thead = document.createElement('thead'); thead.appendChild(tr); t.appendChild(thead);
    const tb = document.createElement('tbody');
    for (const r of rows) {
      const row = document.createElement('tr');
      r.forEach((c, j) => { const cell = document.createElement(j ? 'td' : 'th'); if (!j) cell.scope = 'row'; cell.textContent = c; row.appendChild(cell); });
      tb.appendChild(row);
    }
    t.appendChild(tb);
    return t;
  }
  function renderTables() {
    const d = DATA[state.seg], s = S(), seg = s.segName[state.seg], days = Array.from({ length: N }, (_, i) => i);
    $('#kpiTable').replaceChildren(
      table(`${s.ringTitle} · ${seg}`, [s.item, s.value], [[s.target, money(d.target)], [s.actual, money(d.R)], [s.attain, Math.round(d.R / d.target * 100) + '%']]),
      table(`${s.kpiTable} · ${seg}`, [s.dateHead, s.kpi.ord, s.kpi.aov, s.kpi.rr], days.map(i => [dayLabel(i), count(d.ord[i]), aovText(d.aovD[i]), d.rateD[i].toFixed(1) + '%']))
    );
    $('#trendTable').replaceChildren(table(`${s.trendTitle} · ${seg}`, [s.dateHead, s.legTY, s.legLY, s.yoy],
      days.map(i => [dayLabel(i), money(d.rev[i]), money(d.revLY[i]), signed(pct(d.rev[i], d.revLY[i]), 1) + '%'])));
    $('#mixTable').replaceChildren(table(`${s.mixTitle} · ${seg}`, [s.chHead, s.revenue, s.share, s.shareChg],
      d.ch.map((v, i) => [s.channels[i], money(v), Math.round(v / d.R * 100) + '%', signed(v / d.R * 100 - d.chLY[i] / d.RL * 100, 1) + s.pp])));
    $('#heatTable').replaceChildren(table(`${s.heatTitle} (${s.avgOrders}) · ${seg}`, [s.dayHead].concat(Array.from({ length: 12 }, (_, h) => s.range(h * 2, h * 2 + 2))),
      d.heatAvg.map((row, w) => [s.daysLong[w]].concat(row.map(v => v.toFixed(1))))));
    $('#rankTable').replaceChildren(table(`${s.rankTitle} · ${seg}`, [s.catHead, s.revenue, s.lastYear, s.yoy],
      rankOrder(d).map(ci => [s.cats[ci], money(d.cat[ci]), money(d.catLY[ci]), signed(pct(d.cat[ci], d.catLY[ci]), 1) + '%'])));
  }

  /* ================= 고객 유형 필터 ================= */
  const tabsEl = $('#tabs');
  for (const seg of SEGS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.id = 'tab-' + seg; b.dataset.seg = seg;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'panel');
    b.addEventListener('click', () => selectSeg(seg));
    tabsEl.appendChild(b);
  }
  function syncTabs() {
    for (const b of $$('.tab', tabsEl)) {
      const on = b.dataset.seg === state.seg;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    }
    $('#panel').setAttribute('aria-labelledby', 'tab-' + state.seg);
  }
  tabsEl.addEventListener('keydown', e => {
    const idx = SEGS.indexOf(state.seg);
    const next = { ArrowRight: idx + 1, ArrowLeft: idx - 1, Home: 0, End: SEGS.length - 1 }[e.key];
    if (next == null) return;
    e.preventDefault();
    const seg = SEGS[(next + SEGS.length) % SEGS.length];
    selectSeg(seg);
    $('#tab-' + seg).focus();
  });
  function selectSeg(seg) {
    if (seg === state.seg) return;
    state.seg = seg;
    syncTabs();
    DN.focus = DN.hover = null; HM.focus = HM.hover = null; RK.focus = RK.hover = null;
    renderKpis(true);
    tweenRing(false);
    tweenSparks();
    tweenTrend();
    tweenDonut();
    renderMixLegend();
    renderHeat(false);
    renderRank('swap');
    renderTables();
  }

  /* ================= 언어 ================= */
  function applyStatic() {
    const s = S();
    document.documentElement.lang = state.lang;
    document.title = s.docTitle;
    for (const el of $$('[data-i18n]')) el.textContent = s[el.dataset.i18n];
    for (const b of $$('.tab', tabsEl)) b.textContent = s.tabs[b.dataset.seg];
    tabsEl.setAttribute('aria-label', s.tablist);
    TR.el.setAttribute('aria-label', s.trendAria);
    DN.el.setAttribute('aria-label', s.mixAria);
    HM.el.setAttribute('aria-label', s.heatAria);
    RK.el.setAttribute('aria-label', s.rankAria);
    for (const b of $$('.lang button')) b.setAttribute('aria-pressed', b.dataset.lang === state.lang ? 'true' : 'false');
  }
  function setLang(lang) {
    state.lang = lang;
    applyStatic();
    renderKpiText();
    drawRing();
    for (const id of ['ord', 'aov', 'rr']) drawSpark(id);
    drawTrend();
    renderMixLegend();
    renderHeat(false);
    renderRank();
    renderTables();
  }
  for (const b of $$('.lang button')) b.addEventListener('click', () => { if (b.dataset.lang !== state.lang) setLang(b.dataset.lang); });

  /* ================= 시작 ================= */
  syncTabs();
  applyStatic();
  renderKpiText();
  tweenRing(true);
  for (const id of ['ord', 'aov', 'rr']) drawSpark(id);
  drawTrend(true);
  if (!REDUCE) DN.el.classList.add('intro');
  drawDonut();
  renderMixLegend();
  renderHeat(true);
  renderRank('intro');
  renderTables();

  // 폭이 바뀔 때만 다시 그린다(처음 등장 애니메이션을 끊지 않도록 같은 폭이면 건너뛴다)
  const ro = new ResizeObserver(entries => {
    for (const en of entries) {
      const el = en.target;
      if (el === TR.el) { if (TR.el.clientWidth !== TR.w) drawTrend(); }
      else drawSpark(el.closest('.kpi').id.slice(2));
    }
  });
  ro.observe(TR.el);
  for (const id of ['ord', 'aov', 'rr']) ro.observe(K[id].viz);
})();
</script>
</body>
</html>
