<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Anthropic style · Publisher sales sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/lib/embed.js" defer></script>
<script>
  // 캡처 모드(?shot=1): 언어 토글과 샘플 안내를 숨기고 마지막 줄을 화면 끝까지 늘린다. Brands의 고지는 이미지에도 남긴다
  if (/[?&]shot=1(&|$)/.test(location.search)) document.documentElement.classList.add('vz-shot');
</script>
<style>
  /* Anthropic style (Brands 01) — Ivory, Editorial, Quiet · 아이보리, 에디토리얼, 고요함
     anthropic.com · claude.com의 공개 디자인에서 읽어 낸 참고용 스타일. 공식 디자인이 아니며 로고·서체·데이터는 쓰지 않는다.
     이 화면 하나가 라이브 샘플이자 포스터(1080×1350)와 커버(1440×810)의 원본이다.
     키 컬러는 양장본의 천 색상, 서체는 인쇄 예정 도서의 조판, 사진 자리는 이달의 책 표지(색 블록)에 들어간다. */
  :root{
    --canvas:#faf9f5; --card:#f0eee6; --card-strong:#e8e6dc; --pill:#f5f4ed;
    --ink:#141413; --ink-2:#30302e; --body:#3d3d3a; --text-2:#5e5d59; --text-3:#73726c; --muted:#87867f;
    --hair:#e8e6dc; --hair-2:#dedcd1; --hair-dark:#30302e; --dark-2:#1f1e1d; --on-dark:#faf9f5; --on-dark-2:#9c9a92;
    --clay:#d97757; --clay-deep:#c46849; --prev:#73726c; --good:#2c6e4f; --bad:#a33d34; --focus:#2c84db;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.165,.84,.44,1);
    --r:16px; --gap:16px; --pad:22px;
  }
  /* 언어마다 본문 서체 하나, 제목 서체 하나: 영어 Inter · Source Serif 4, 한국어 Pretendard · Noto Serif KR */
  html[lang="ko"]{
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --serif:'Noto Serif KR','AppleMyungjo','Batang',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  html[lang="ko"] body{word-break:keep-all}
  p{margin:0}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .page{max-width:1240px;margin:0 auto;padding:36px 48px 30px}

  /* ---------- 머리: 시리즈 · 이름(설명형, 세리프) · 세 단어 ---------- */
  .head{position:relative}
  .series{font-size:12.5px;font-weight:500;letter-spacing:.16em;color:var(--text-2)}
  .head h1{margin:10px 0 0 -2px;font-family:var(--serif);font-size:56px;font-weight:400;line-height:1.06;letter-spacing:-.022em;color:var(--ink)}
  html[lang="ko"] .head h1{letter-spacing:-.02em}
  .words{margin-top:6px;font-size:22px;line-height:1.35;color:var(--text-2)}
  .lang{position:absolute;top:-8px;right:0;display:inline-flex;height:32px;padding:3px;border-radius:999px;border:1px solid var(--hair);background:var(--pill)}
  .lang button{border:0;background:none;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--text-2);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}

  /* ---------- 필터: 아래 모든 카드에 함께 적용 ---------- */
  .filter{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;margin-top:22px;padding-top:14px;border-top:1px solid var(--hair)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:var(--canvas);font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:background-color .2s var(--ease),color .2s var(--ease)}
  .tab:hover{background:var(--pill);color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--card-strong);border-color:var(--hair-2);color:var(--ink);font-weight:500}
  .aside{font-size:12.5px;color:var(--text-2)}

  /* ---------- 문장으로 시작하는 대시보드 ---------- */
  .lede{margin-top:24px}
  .stmt{margin:0;font-family:var(--serif);font-size:31px;font-weight:400;line-height:1.26;letter-spacing:-.012em;color:var(--text-2);text-wrap:balance}
  .stmt b{font-weight:500;color:var(--ink);white-space:nowrap}
  .lead{margin-top:8px;font-size:15px;line-height:1.6;color:var(--text-2)}
  .lead i{font-style:normal;font-family:var(--serif);color:var(--ink)}
  html[lang="en"] .lead i{font-style:italic}

  /* ---------- 카드 ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-top:22px}
  .row{display:grid;gap:var(--gap);margin-top:var(--gap)}
  .row-a{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
  .row-b{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;padding:18px var(--pad);border-radius:var(--r);background:var(--card)}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;margin-bottom:10px}
  .card-t{margin:0;font-size:15px;font-weight:500;line-height:22px;color:var(--ink)}
  .card-t small{margin-left:8px;font-size:12.5px;font-weight:400;color:var(--text-2)}

  /* KPI: 지표명 → 수치(가깝게) → 증감(한 칸 띄워서). 세 줄을 subgrid로 맞춰 지표명이나 증감이 줄바꿈돼도
     같은 줄 카드의 수치 높이가 같다 */
  .kpi{grid-row:span 3;display:grid;grid-template-rows:subgrid;row-gap:0;padding-top:16px;padding-bottom:16px}
  .kpi .lbl{font-size:13px;line-height:1.4;color:var(--text-2);padding-bottom:6px}
  .kpi .sub{padding-top:12px}
  .fig{font-size:32px;line-height:1.1;font-weight:400;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .u{font-size:13px;letter-spacing:0;color:var(--text-2);margin-left:3px}
  .u.pre{margin:0 2px 0 0}
  .sub{font-size:13px;line-height:1.35;color:var(--text-2)}
  .sub b{font-weight:600;color:var(--good);margin-right:5px}
  .sub b.bad{color:var(--bad)}
  .sub b.flat{color:var(--text-2)}

  /* 월 매출: 카드 끝에서 끝까지 그리는 클레이 곡선과 점선 전년 */
  .lgs{display:flex;flex-wrap:wrap;gap:4px 14px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
  .k-line{width:16px;height:0;flex:none;border-top:2px solid var(--c);border-radius:2px}
  .k-line.dotted{border-top-style:dotted}
  .chart{position:relative;flex:1 1 auto;min-height:170px;margin:0 calc(var(--pad) * -1) -8px}
  .chart > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
  .ax{font-size:11px;fill:var(--text-3);font-variant-numeric:tabular-nums}
  .ax.em{fill:var(--ink)}
  .end{font-size:12px;font-weight:500;fill:var(--ink);font-variant-numeric:tabular-nums}
  .end.prev{font-weight:400;fill:var(--text-2)}
  .tip{position:absolute;z-index:6;left:0;top:0;pointer-events:none;background:var(--canvas);border:1px solid var(--hair-2);border-radius:8px;padding:8px 11px 9px;box-shadow:0 8px 22px rgba(20,20,19,.10);white-space:nowrap;opacity:0;transition:opacity .14s ease}
  .tip.on{opacity:1}
  .tip::after{content:"";position:absolute;width:9px;height:9px;background:var(--canvas);border-right:1px solid var(--hair-2);border-bottom:1px solid var(--hair-2)}
  .tip[data-side="above"]::after{left:var(--ax);bottom:0;transform:translate(-50%,50%) rotate(45deg)}
  .tip[data-side="below"]::after{left:var(--ax);top:0;transform:translate(-50%,-50%) rotate(225deg)}
  .tip[data-side="left"]::after{top:var(--ay);right:0;transform:translate(50%,-50%) rotate(-45deg)}
  .tip[data-side="right"]::after{top:var(--ay);left:0;transform:translate(-50%,-50%) rotate(135deg)}
  .tip-h{font-size:11px;color:var(--text-2);margin-bottom:3px}
  .tip-r{display:flex;align-items:center;gap:7px;line-height:1.55}
  .tip-r b{font-size:13.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  .tip-r span{font-size:11.5px;color:var(--text-2)}

  /* 베스트셀러: 헤어라인 행, 세리프 제목 */
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--hair)}
  .rows li:first-child{border-top:0;padding-top:2px}
  .rk{width:18px;flex:none;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nm{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
  .ttl{font-family:var(--serif);font-size:15px;line-height:1.35;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  html[lang="en"] .ttl{font-style:italic}
  .au{flex:none;font-size:12.5px;color:var(--text-2)}
  .val{font-size:13.5px;font-weight:500;color:var(--ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .val .u{font-size:12px;font-weight:400;margin-left:1px}
  .chg{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;min-width:60px;font-size:12.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
  .chg svg{width:11px;height:11px}
  .chg.up{color:var(--good)} .chg.down{color:var(--bad)} .chg.flat{color:var(--text-2)}
  /* 카드가 좁으면 저자를 빼고 제목을 지킨다. container-type은 이 카드에만 둔다(KPI의 subgrid를 막지 않게) */
  #c-bs{container-type:inline-size}
  @container (max-width:420px){ .rows .au{display:none} }

  /* 천 색상: 키 컬러 네 가지가 양장본의 천으로 들어간다 */
  .cloth{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column}
  .cloth li{flex:1;display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;align-content:center;column-gap:12px;padding:5px 0;border-top:1px solid var(--hair)}
  .cloth li:first-child{border-top:0;padding-top:0}
  .swatch{width:26px;height:34px;border-radius:3px;border:1px solid rgba(20,20,19,.16);
    background-image:repeating-linear-gradient(45deg,rgba(20,20,19,.06) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(20,20,19,.06) 0 1px,transparent 1px 3px)}
  .swatch.dark{border-color:transparent;background-image:repeating-linear-gradient(45deg,rgba(250,249,245,.08) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(250,249,245,.08) 0 1px,transparent 1px 3px)}
  .cloth .name{display:block;font-size:13.5px;color:var(--ink)}
  .cloth .hex{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--text-2)}
  .cloth .num{text-align:right;font-size:13.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  .cloth .num small{display:block;font-size:12px;font-weight:400;color:var(--text-2)}

  /* 인쇄 예정: 다음 책의 조판으로 서체를 보여 준다 */
  .press-title{font-family:var(--serif);font-size:19px;line-height:1.3;color:var(--ink)}
  html[lang="en"] .press-title{font-style:italic}
  .press-meta{margin-top:3px;font-size:12.5px;color:var(--text-2)}
  .spec{list-style:none;margin:10px 0 0;padding:0;flex:1;display:flex;flex-direction:column}
  .spec li{flex:1;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:baseline;align-content:center;column-gap:12px;padding:6px 0;border-top:1px solid var(--hair)}
  .spec .role{font-size:12.5px;color:var(--text-2)}
  .spec .face{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spec .f-serif{font-family:var(--serif);font-size:18px}
  .spec .f-sans{font-family:var(--font);font-size:15px}
  .spec .f-mono{font-family:var(--mono);font-size:13.5px}
  .spec .size{font-family:var(--mono);font-size:12px;color:var(--text-2);white-space:nowrap}

  /* 이달의 책: 사진 대신 색 블록으로 그린 표지와 책 정보 */
  .bk{flex:1;display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);column-gap:16px}
  .cover{position:relative;align-self:start;width:100%;max-width:150px;aspect-ratio:2/3;border-radius:2px 4px 4px 2px;container-type:inline-size;overflow:hidden}
  .cover.light{box-shadow:inset 0 0 0 1px rgba(20,20,19,.14)}
  .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:rgba(20,20,19,.1)}
  .b-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:15cqw 11cqw 11cqw 17cqw}
  .b-title{font-family:var(--serif);font-size:14.5cqw;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
  .b-rule{width:16cqw;border-top:1px solid currentColor;opacity:.55;margin:9cqw 0 7cqw}
  .b-author{font-size:7.5cqw;letter-spacing:.02em;opacity:.85}
  .b-pub{margin-top:auto;font-size:6cqw;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  html[lang="ko"] .b-pub{letter-spacing:.06em}
  .bk-info{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
  .bk-author{margin-top:12px;font-size:14px;color:var(--ink)}
  .bk-meta{margin-top:2px;font-size:12.5px;color:var(--text-2)}
  .bk-val{margin-top:auto;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bk-val .u{font-size:13px}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--clay);font-size:11.5px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}

  /* ---------- 잉크 띠: 신간 성과 표 ---------- */
  .band{margin-top:var(--gap);padding:20px 28px 14px;border-radius:var(--r);background:var(--ink);color:var(--on-dark)}
  .band-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;margin-bottom:6px}
  .band-t{margin:0;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.3;letter-spacing:-.01em;color:var(--on-dark)}
  .band .aside{color:var(--on-dark-2)}
  .tbl-wrap{overflow-x:auto;scrollbar-width:thin}
  .tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
  .tbl th,.tbl td{padding:8px 10px;text-align:left;font-weight:400;border-top:1px solid var(--hair-dark);white-space:nowrap;vertical-align:middle}
  .tbl thead th{padding-top:4px;padding-bottom:6px;border-top:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2)}
  html[lang="ko"] .tbl thead th{letter-spacing:.02em}
  .tbl th:first-child,.tbl td:first-child{padding-left:0}
  .tbl th:last-child,.tbl td:last-child{padding-right:0}
  .tbl .num{text-align:right}
  .tbl td.num{font-family:var(--mono);font-size:13px;color:var(--on-dark);font-variant-numeric:tabular-nums}
  .tbl td.num .u{font-family:var(--font);font-size:12px;color:var(--on-dark-2);margin-left:1px}
  .tbl .date{font-family:var(--mono);font-size:12.5px;color:var(--on-dark-2)}
  .tbl .t-title{font-family:var(--serif);font-size:15.5px;color:var(--on-dark)}
  html[lang="en"] .tbl .t-title{font-style:italic}
  .tbl .imp{font-size:12.5px;color:var(--on-dark-2)}
  .tbl tbody tr{transition:background-color .15s ease}
  .tbl tbody tr:hover{background:var(--dark-2)}
  .sell{display:inline-flex;align-items:center;gap:10px}
  .sell i{display:block;width:88px;height:6px;border-radius:3px;background:var(--hair-dark);overflow:hidden;flex:none}
  .sell i b{display:block;height:100%;border-radius:3px;background:var(--clay-deep)}
  .sell span{min-width:34px;text-align:right}
  .rep{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--clay);font-size:11.5px;letter-spacing:.02em;color:var(--on-dark);white-space:nowrap}
  .rep.no{border-color:var(--hair-dark);color:var(--on-dark-2)}

  /* ---------- 고지 ---------- */
  .foot{margin-top:14px;max-width:100ch;font-size:12px;line-height:1.6;color:var(--text-2)}
  .foot p + p{margin-top:4px}

  /* ---------- 움직임 ---------- */
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fade{animation:fade .45s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ---------- 임베드(?embed=1 · lib/embed.js)와 캡처(?shot=1) ---------- */
  html.vz-embed .foot{display:none}
  html.vz-shot *,html.vz-shot *::before,html.vz-shot *::after{animation:none!important;transition:none!important}
  html.vz-shot .lang,html.vz-shot .foot .note{display:none}
  html.vz-shot .page{min-height:100vh;display:flex;flex-direction:column}
  html.vz-shot #panel{flex:1;display:flex;flex-direction:column}
  html.vz-shot .row-b{flex:1}

  /* ---------- 반응형 ---------- */
  @media (max-width:1100px){
    .page{padding:36px 32px 32px}
  }
  @media (max-width:900px){
    .page{padding:32px 24px 30px}
    .head h1{font-size:52px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .row-a{grid-template-columns:minmax(0,1fr)}
    .row-a .chart{min-height:220px}
    .row-b{grid-template-columns:repeat(2,minmax(0,1fr))}
    .row-b > .c-book{grid-column:1 / -1}
    .c-book .bk{grid-template-columns:140px minmax(0,1fr)}
    .tbl{min-width:0}
    .tbl .c-date{display:none}
    .tbl .t-title{white-space:normal}
  }
  @media (max-width:600px){
    :root{--gap:12px;--pad:18px}
    .page{padding:22px 16px 26px}
    .series{font-size:11.5px;letter-spacing:.14em}
    .head h1{margin-top:10px;font-size:40px}
    .words{font-size:18px}
    .filter{margin-top:20px}
    .filter .aside{width:100%}
    .stmt{font-size:24px}
    .lead{font-size:14px}
    .kpis{gap:10px}
    .card{padding:16px var(--pad)}
    .fig{font-size:26px}

    document.documentElement.lang = state.lang;
    document.title = t.docTitle;
    for (const el of $$('[data-i18n]')) { const val = pick(t, el.dataset.i18n); if (typeof val === 'string') el.textContent = val; }
    for (const b of $$('.tab', tabsEl)) b.textContent = t.tabs[b.dataset.k];
    tabsEl.setAttribute('aria-label', t.tabsLabel);
    for (const b of $$('.lang button')) b.setAttribute('aria-pressed', b.dataset.lang === state.lang ? 'true' : 'false');
  }
  function renderAll(animate) {
    const v = state.view = getView(state.imprint);
    renderStatement(v, animate); renderKpis(v, animate); renderTr(v, animate); renderBs(v, animate);
    renderCloth(v, animate); renderPress(v, animate); renderBook(v, animate); renderRel(v, animate);
  }
  function select(k) {
    if (k === state.imprint) return;
    state.imprint = k;
    syncTabs();
    renderAll(true);
  }
  for (const b of $$('.lang button')) b.addEventListener('click', () => {
    if (b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang;
    applyLang();
    renderAll(false);
  });
  // 터치: 다른 곳을 누르면 차트의 고정된 점을 풀어 마지막 달로 돌아간다
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const card = $('#c-tr');
    if (card._reset && !card.contains(e.target)) card._reset();
  });

  syncTabs();
  applyLang();
  renderAll(true);
  if ('ResizeObserver' in window) {
    new ResizeObserver(() => {
      const box = $('#trChart');
      if (state.view && (Math.round(box.clientWidth) !== box._w || Math.round(box.clientHeight) !== box._h)) drawTr(false);
    }).observe($('#trChart'));
  }
  // 글꼴이 늦게 오면 글자 폭과 카드 높이가 바뀌므로 차트를 한 번 더 그린다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.view) drawTr(false); });
})();
</script>
</body>
</html>
