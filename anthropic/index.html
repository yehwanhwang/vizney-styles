<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Anthropic · Publisher sales sample</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@v3.3.0/css/SpoqaHanSansNeo.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<script src="/lib/embed.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#faf9f5}
.vz{
  --canvas:#faf9f5;--card:#f0eee6;--card-strong:#e8e6dc;--pill:#f5f4ed;
  --ink:#141413;--ink-2:#30302e;--body:#3d3d3a;--text-2:#5e5d59;--text-3:#73726c;--muted:#87867f;
  --hair:#e8e6dc;--hair-2:#dedcd1;--hair-dark:#30302e;
  --dark:#141413;--dark-2:#1f1e1d;--on-dark:#faf9f5;--on-dark-2:#9c9a92;
  --clay:#d97757;--clay-deep:#c46849;--plum:#6953a0;--teal:#0d9298;--other:#b0aea5;--prev:#b0aea5;
  --good:#2c6e4f;--bad:#a33d34;--focus:#2c84db;
  --serif:"Source Serif 4","Noto Serif KR","Apple SD Gothic Neo","Noto Serif CJK KR",Georgia,serif;
  --sans:"Spoqa Han Sans Neo","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Spoqa Han Sans Neo",monospace;
  --ease:cubic-bezier(.165,.84,.44,1);
  --r:16px;--pad:24px;--gap:16px;--page:32px;
  color-scheme:light;
  font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--body);background:var(--canvas);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;word-break:keep-all;
}
.vz button{font:inherit;color:inherit}
.vz :focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
.vz-wrap{max-width:1400px;margin:0 auto;padding:0 var(--page) 28px}

/* ---------- header ---------- */
.vz-top{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 0}
.vz-brand{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;line-height:1.2}
.vz-brand small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.vz-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--hair);background:var(--pill);font-size:13px;letter-spacing:.01em;color:var(--body);white-space:nowrap;text-decoration:none;cursor:default}
.pill svg{color:var(--muted);flex:none}
.pill-ink{background:var(--ink);border-color:var(--ink);color:var(--on-dark);cursor:pointer;transition:background-color .2s var(--ease)}
.pill-ink svg{color:var(--on-dark-2)}
.pill-ink:hover{background:var(--ink-2)}
.vz-lang{display:inline-flex;height:32px;padding:3px;border-radius:999px;border:1px solid var(--hair);background:var(--pill)}
.vz-lang button{appearance:none;border:0;background:none;font-size:12px;font-weight:500;color:var(--text-2);padding:0 10px;border-radius:999px;cursor:pointer;letter-spacing:.03em}
.vz-lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}

/* ---------- filter row ---------- */
.vz-filter{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:14px 0 0;border-top:1px solid var(--hair)}
.vz-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.vz-tabs::-webkit-scrollbar{display:none}
.vz-tab{appearance:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--hair);background:var(--canvas);font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:background-color .2s var(--ease),color .2s var(--ease)}
.vz-tab:hover{background:var(--pill);color:var(--ink)}
.vz-tab[aria-pressed="true"]{background:var(--card-strong);border-color:var(--hair-2);color:var(--ink);font-weight:500}
.vz-filter .aside{margin-left:auto}

/* ---------- statement ---------- */
.vz-hero{padding:40px 0 34px;max-width:1040px}
.vz-stmt{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.9vw,40px);line-height:1.28;letter-spacing:-.012em;color:var(--text-2);text-wrap:balance}
.vz-stmt b{font-weight:500;color:var(--ink);white-space:nowrap}
.vz-lead{margin:14px 0 0;font-size:15.5px;line-height:1.6;color:var(--text-2);max-width:72ch}
.vz-lead i{font-style:normal;font-family:var(--serif);color:var(--ink)}
html[lang=en] .vz-lead i{font-style:italic}

/* ---------- grid ---------- */
.vz-grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr));grid-template-areas:
  "k1 k1 k1 k2 k2 k2 k3 k3 k3 k4 k4 k4"
  "tr tr tr tr tr tr tr bs bs bs bs bs"
  "ch ch ch ch ch ch fm fm fm fm fm fm"}
.a-k1{grid-area:k1}.a-k2{grid-area:k2}.a-k3{grid-area:k3}.a-k4{grid-area:k4}
.a-tr{grid-area:tr}.a-bs{grid-area:bs}.a-ch{grid-area:ch}.a-fm{grid-area:fm}

.card{position:relative;min-width:0;container-type:inline-size;display:flex;flex-direction:column;padding:var(--pad);background:var(--card);border-radius:var(--r)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;min-height:22px;margin-bottom:16px}
.card-t{margin:0;font-size:15px;font-weight:500;line-height:22px;color:var(--ink)}
.aside{font-size:12.5px;color:var(--text-2)}

/* figures */
.kpi{font-size:34px;line-height:1.1;font-weight:400;color:var(--ink);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .u{font-size:15px;font-weight:400;color:var(--text-2);letter-spacing:0;margin-left:3px}
.kpi .u.pre{margin:0 2px 0 0}
.lbl{font-size:13px;color:var(--text-2);margin-bottom:10px}
.delta{margin-top:8px;font-size:12.5px;color:var(--text-2)}
.delta b{font-weight:700;color:var(--good);margin-right:5px}
.delta b.neg{color:var(--bad)}
.delta b.flat{color:var(--text-2)}
.kcard .lbl{margin-bottom:12px}

/* legends */
.lgs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.k-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--c)}
.k-line{width:16px;height:0;flex:none;border-top:2px solid var(--c);border-radius:2px}
.k-line.dotted{border-top-style:dotted}
.k-none{width:16px;flex:none}

/* charts */
.chart{position:relative;flex:1 1 auto;min-height:150px}
.chart>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
.chart-tr{margin:4px calc(var(--pad) * -1) -12px;min-height:214px}
.ax{font-size:11px;fill:var(--text-3);font-variant-numeric:tabular-nums}
.ax.em{fill:var(--ink)}

/* tooltip */
.tip{position:absolute;z-index:6;left:0;top:0;pointer-events:none;background:var(--canvas);border:1px solid var(--hair);border-radius:8px;padding:8px 11px 9px;box-shadow:0 8px 22px rgba(20,20,19,.10);white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .14s ease,transform .14s ease}
.tip.on{opacity:1;transform:none}
.tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:0;width:9px;height:9px;background:var(--canvas);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);transform:translate(-50%,50%) rotate(45deg)}
.tip.below::after{bottom:auto;top:0;transform:translate(-50%,-50%) rotate(225deg)}
.tip-h{font-size:11px;color:var(--text-2);margin-bottom:3px}
.tip-r{display:flex;align-items:center;gap:7px;line-height:1.55}
.tip-r b{font-size:13.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.tip-r span{font-size:11.5px;color:var(--text-2)}

/* hairline rows (bestsellers, channels, formats) */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair);font-size:13.5px;transition:opacity .2s ease}
.rows li:first-child{border-top:0;padding-top:0}
.rows li.dim{opacity:.4}
.rows .rk{width:18px;flex:none;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rows .nm{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;color:var(--ink);white-space:nowrap;overflow:hidden}
.rows .ttl{font-family:var(--serif);font-size:15px;line-height:1.3;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
html[lang=en] .rows .ttl{font-style:italic}
.rows .au{font-size:12.5px;color:var(--text-2);flex:none}
.rows .val{font-weight:500;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .val .u{font-size:.9em;font-weight:400;color:var(--text-2);margin-left:1px}
.rows .pct{width:42px;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums}
.chg{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;min-width:58px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg svg{width:11px;height:11px}
.chg.up{color:var(--good)}
.chg.down{color:var(--bad)}
.chg.flat{color:var(--text-2)}
.rows .bar{flex:1 1 0;min-width:40px;height:6px;border-radius:3px;background:var(--card-strong);overflow:hidden}
.rows .bar i{display:block;height:100%;border-radius:3px;background:var(--clay);transition:width .7s var(--ease)}
.rows .bar i.on{background:var(--clay-deep)}
.a-ch .rows .nm{flex:0 0 132px}
.a-ch .rows .val{width:72px}
.more{appearance:none;margin-top:auto;padding-top:16px;border:0;background:none;cursor:pointer}
.more span{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:10px;border:1px solid var(--hair-2);background:var(--card-strong);font-size:13px;font-weight:500;color:var(--ink-2);transition:background-color .2s var(--ease)}
.more:hover span{background:#dedcd1}

/* format stack */
.stack{display:flex;gap:2px;height:10px;margin:2px 0 18px}
.stack i{display:block;flex:1 1 0;min-width:3px;transition:flex-grow .6s var(--ease),opacity .2s ease}
.stack i:first-child{border-radius:5px 0 0 5px}
.stack i:last-child{border-radius:0 5px 5px 0}
.stack.dim i:not(.on){opacity:.3}
.stack:focus-visible{outline-offset:4px}
.a-fm .rows .nm{gap:9px;align-items:center}
.a-fm .kpi,.a-ch .kpi{margin-bottom:14px}

/* ---------- dark band: new releases ---------- */
.band{margin-top:var(--gap);padding:28px 32px 30px;border-radius:var(--r);background:var(--dark);color:var(--on-dark)}
.band-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin-bottom:12px}
.band-t{margin:0;font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.01em;line-height:1.3;color:var(--on-dark)}
.band .aside{color:var(--on-dark-2)}
.tbl-wrap{overflow-x:auto;scrollbar-width:thin;margin:0 -8px;padding:0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.tbl th,.tbl td{padding:12px 10px;text-align:left;font-weight:400;border-top:1px solid var(--hair-dark);white-space:nowrap;vertical-align:middle}
.tbl thead th{font-family:var(--sans);font-weight:400;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2);border-top:0;padding-top:4px}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl .num{text-align:right;font-family:var(--mono);font-size:13px;color:var(--on-dark);font-variant-numeric:tabular-nums}
.tbl .num .u{font-family:var(--sans);font-size:12px;color:var(--on-dark-2);margin-left:1px}
.tbl .mono{font-family:var(--mono);font-size:12.5px;color:var(--on-dark-2)}
.tbl .ttl{font-family:var(--serif);font-size:15.5px;color:var(--on-dark);white-space:normal;min-width:170px}
html[lang=en] .tbl .ttl{font-style:italic}
.tbl .au{color:var(--on-dark-2)}
.tbl .imp{color:var(--on-dark-2);font-size:12.5px}
.tbl tbody tr{transition:background-color .15s ease}
.tbl tbody tr:hover{background:var(--dark-2)}
.tbl tbody tr:hover td:first-child{border-radius:6px 0 0 6px}
.tbl tbody tr:hover td:last-child{border-radius:0 6px 6px 0}
.sell{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.sell i{display:block;width:88px;height:6px;border-radius:3px;background:var(--hair-dark);overflow:hidden;flex:none}
.sell i b{display:block;height:100%;border-radius:3px;background:var(--clay);transition:width .8s var(--ease)}
.sell span{font-family:var(--mono);font-size:13px;min-width:44px;text-align:right}
.rep{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--clay);font-size:11.5px;letter-spacing:.04em;color:var(--on-dark);white-space:nowrap}
.rep.no{border-color:var(--hair-dark);color:var(--on-dark-2)}

/* ---------- footer ---------- */
.vz-foot{margin:22px 0 0;font-size:12.5px;line-height:1.65;color:var(--text-2);max-width:88ch}
.vz-foot p{margin:0}
.vz-foot p+p{margin-top:6px}
.vz-foot b{font-weight:500;color:var(--body)}

/* ---------- embed (블로그 iframe, ?embed=1 · lib/embed.js) ---------- */
html.vz-embed .vz{min-height:0}
html.vz-embed .vz-foot{display:none}
html.vz-embed .vz-wrap{padding-bottom:20px}

.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* motion */
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}}
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.vz *,.vz *::before,.vz *::after{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1359px){
  .vz{--page:24px;--gap:14px}
  .vz-hero{padding:32px 0 28px}
}
@media (max-width:1179px){
  .vz-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"k1 k2 k3 k4" "tr tr tr tr" "bs bs bs bs" "ch ch fm fm"}
}
@media (max-width:899px){
  .vz-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"k1 k2" "k3 k4" "tr tr" "bs bs" "ch ch" "fm fm"}
  .vz-top{min-height:64px;padding:10px 0}
  .vz-brand{font-size:18px}
  .vz-brand small{display:none}
  .pill-period{display:none}
  .vz-filter .aside{display:none}
}
@media (max-width:639px){
  .vz{--page:16px;--gap:12px;--pad:20px}
  .vz-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"k1" "k2" "k3" "k4" "tr" "bs" "fm" "ch"}
  .vz-hero{padding:26px 0 22px}
  .vz-stmt{font-size:25px}
  .kpi{font-size:30px}
  .band{padding:22px 20px 24px}
  .band-t{font-size:20px}
  .rows .au{display:none}
  .a-ch .rows .nm{flex-basis:96px}
  .tbl{min-width:520px}
  .tbl .au,.tbl .imp{display:none}
  .vz-tools{gap:8px}
  .pill-ink{display:none}
}
</style>
</head>
<body>
<div class="vz" id="vz"><div class="vz-wrap">
  <header class="vz-top">
    <div class="vz-brand"><span data-i18n="brand"></span><small data-i18n="brandSub"></small></div>
    <div class="vz-tools">
      <span class="pill pill-period"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-i18n="period"></span></span>
      <div class="vz-lang" role="group" aria-label="Language"><button type="button" data-lang="ko">KO</button><button type="button" data-lang="en">EN</button></div>
      <a class="pill pill-ink" href="#releases" data-i18n="toReleases"></a>
    </div>
  </header>

  <div class="vz-filter">
    <nav class="vz-tabs">
      <button class="vz-tab" type="button" data-imprint="all"></button>
      <button class="vz-tab" type="button" data-imprint="fic"></button>
      <button class="vz-tab" type="button" data-imprint="non"></button>
      <button class="vz-tab" type="button" data-imprint="kid"></button>
    </nav>
    <span class="aside" data-i18n="basis"></span>
  </div>

  <section class="vz-hero" aria-labelledby="stmt">
    <h1 class="vz-stmt" id="stmt" data-v="stmt"></h1>
    <p class="vz-lead" data-v="lead"></p>
  </section>

  <main class="vz-grid">
    <section class="card kcard a-k1" id="c-rev">
      <div class="lbl" data-i18n="kpi.rev"></div>
      <div class="kpi" data-v="kpi"></div>
      <div class="delta" data-v="delta"></div>
    </section>
    <section class="card kcard a-k2" id="c-cop">
      <div class="lbl" data-i18n="kpi.copies"></div>
      <div class="kpi" data-v="kpi"></div>
      <div class="delta" data-v="delta"></div>
    </section>
    <section class="card kcard a-k3" id="c-ret">
      <div class="lbl" data-i18n="kpi.returns"></div>
      <div class="kpi" data-v="kpi"></div>
      <div class="delta" data-v="delta"></div>
    </section>
    <section class="card kcard a-k4" id="c-dig">
      <div class="lbl" data-i18n="kpi.digital"></div>
      <div class="kpi" data-v="kpi"></div>
      <div class="delta" data-v="delta"></div>
    </section>

    <!-- 월 매출 추이 -->
    <section class="card a-tr" id="c-tr">
      <div class="card-h">
        <h2 class="card-t" data-i18n="tr.t"></h2>
        <div class="lgs">
          <span class="lg"><i class="k-line" style="--c:#d97757"></i><span data-i18n="tr.s1"></span></span>
          <span class="lg"><i class="k-line dotted" style="--c:#b0aea5"></i><span data-i18n="tr.s2"></span></span>
        </div>
      </div>
      <div class="lbl" data-i18n="tr.lbl"></div>
      <div class="kpi" data-v="kpi"></div>
      <div class="delta" data-v="delta"></div>
      <div class="chart chart-tr" data-chart="tr"></div>
      <div class="tip" aria-hidden="true"></div>
      <div class="sr-only"><table data-v="table"></table></div>
    </section>

    <!-- 베스트셀러 -->
    <section class="card a-bs" id="c-bs">
      <div class="card-h"><h2 class="card-t" data-i18n="bs.t"></h2><span class="aside" data-i18n="bs.aside"></span></div>
      <ol class="rows" data-v="rows"></ol>
      <button class="more" type="button" data-v="more" aria-expanded="false"><span><span data-v="moreText"></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5"/></svg></span></button>
    </section>

    <!-- 판매 채널 -->
    <section class="card a-ch" id="c-ch">
      <div class="card-h"><h2 class="card-t" data-i18n="ch.t"></h2><span class="aside" data-i18n="ch.aside"></span></div>
      <div class="lbl" data-i18n="ch.lbl"></div>
      <div class="kpi" data-v="kpi"></div>
      <ul class="rows" data-v="rows" tabindex="0" role="group"></ul>
      <div class="tip" aria-hidden="true"></div>
      <div class="sr-only"><table data-v="table"></table></div>
    </section>

    <!-- 판형별 매출 -->
    <section class="card a-fm" id="c-fm">

      prev: DATA.months.map((_, i) => sum(bs.map(b => b.prev[i]))),
      copies: sum(bs.map(b => b.copies)), copiesPrev: sum(bs.map(b => b.copiesPrev)),
      shipped: sum(bs.map(b => b.shipped)), returned: sum(bs.map(b => b.returned)),
      shippedPrev: sum(bs.map(b => b.shippedPrev)), returnedPrev: sum(bs.map(b => b.returnedPrev)),
      channels: [0, 1, 2, 3].map(i => sum(bs.map(b => b.channels[i]))),
      formats: [0, 1, 2].map(i => sum(bs.map(b => b.formats[i]))),
      best, rel, n
    };
  }

  /* ---------- statement + KPI cards ---------- */
  function renderStatement(v) {
    const t = L(), n = v.n, cur = v.rev[n - 1], py = v.prev[n - 1];
    const pct = (cur / py - 1) * 100;
    $('[data-v=stmt]').replaceChildren(...richNodes(t.stmt(moneyLong(cur), nf(Math.abs(pct), 1) + '%', pct >= 0)));
    const top = v.best[0];
    $('[data-v=lead]').replaceChildren(...richNodes(t.lead(top[state.lang], top['a_' + state.lang], nf(top.c))));
  }
  function renderKpis(v) {
    const t = L(), n = v.n;
    const rev = $('#c-rev'), cop = $('#c-cop'), ret = $('#c-ret'), dig = $('#c-dig');
    fillFig($('[data-v=kpi]', rev), moneyParts(v.rev[n - 1]));
    deltaNode($('[data-v=delta]', rev), (v.rev[n - 1] / v.prev[n - 1] - 1) * 100, 1, '%', t.kpi.vsY);
    fillFig($('[data-v=kpi]', cop), countParts(v.copies, t.kpi.unitCopies));
    deltaNode($('[data-v=delta]', cop), (v.copies / v.copiesPrev - 1) * 100, 1, '%', t.kpi.vsM);
    const rr = v.returned / v.shipped * 100, rp = v.returnedPrev / v.shippedPrev * 100;
    fillFig($('[data-v=kpi]', ret), [{ t: nf(rr, 1) }, { t: '%', u: 1 }]);
    deltaNode($('[data-v=delta]', ret), rr - rp, 1, t.kpi.pts, t.kpi.vsM, false);
    const total = sum(v.formats), e = v.formats[1] / total * 100, a = v.formats[2] / total * 100;
    fillFig($('[data-v=kpi]', dig), [{ t: nf(e + a, 1) }, { t: '%', u: 1 }]);
    $('[data-v=delta]', dig).replaceChildren(t.kpi.digitalSub(nf(e, 1), nf(a, 1)));
  }

  /* ---------- 월 매출 추이 : smooth line ---------- */
  function drawTr(v, animate) {
    const card = $('#c-tr'), box = $('[data-chart=tr]', card), t = L();
    const W = Math.round(box.clientWidth), H = Math.round(box.clientHeight);
    if (!W || !H) return;
    box._w = W; box._h = H;
    const n = v.n, padL = 24, padR = 28, top = 14, axisH = 30, bottom = H - axisH;
    const all = v.rev.concat(v.prev);
    const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo;
    const y0 = lo - span * .25, y1 = hi + span * .12;
    const step = (W - padL - padR) / (n - 1);
    const X = i => padL + i * step, Y = val => bottom - (val - y0) / (y1 - y0) * (bottom - top);
    const A = v.rev.map((val, i) => [X(i), Y(val)]), B = v.prev.map((val, i) => [X(i), Y(val)]);
    const last = n - 1, peak = v.rev.indexOf(Math.max(...v.rev));

    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: 0,
      'aria-label': t.tr.aria(partsText(moneyParts(sum(v.rev))), signed((sum(v.rev) / sum(v.prev) - 1) * 100, 1) + '%', monLong(peak), partsText(moneyParts(v.rev[peak]))) });
    const base = Math.round(bottom) + .5;
    svg.append(sv('line', { x1: padL - 6, x2: W - padR + 6, y1: base, y2: base, stroke: C.hair2, 'stroke-width': 1 }));
    const cross = sv('line', { y1: top - 2, y2: bottom + 2, stroke: C.hair2, 'stroke-width': 1 });
    svg.append(sv('path', { d: smooth(B), fill: 'none', stroke: C.prev, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-dasharray': '0.1 5', class: animate ? 'fade' : null }));
    svg.append(sv('path', { d: smooth(A), fill: 'none', stroke: C.clay, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: animate ? 1 : null, class: animate ? 'draw' : null }));
    svg.append(sv('circle', { cx: A[last][0], cy: A[last][1], r: 4.5, fill: C.canvas, stroke: C.clay, 'stroke-width': 2 }));
    const dotB = sv('circle', { r: 3.5, fill: C.prev, stroke: C.canvas, 'stroke-width': 2 });
    const halo = sv('circle', { r: 13, fill: C.clay, 'fill-opacity': .18 });
    const dotA = sv('circle', { r: 5, fill: C.canvas, stroke: C.ink, 'stroke-width': 2.5 });
    const hl = sv('g', { class: animate ? 'fade' : null, style: animate ? { animationDelay: '.9s' } : null }, cross, dotB, halo, dotA);
    svg.append(hl);
    [0, 3, 6, 9, last].forEach(i => svg.append(sv('text', { x: X(i), y: H - 11, 'text-anchor': i === last ? 'end' : i === 0 ? 'start' : 'middle', class: 'ax' + (i === last ? ' em' : ''), text: monShort(i) })));
    svg.append(sv('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' }));
    box.replaceChildren(svg);

    let cur = last;
    const set = (i, quiet) => {
      cur = i;
      const [x, ya] = A[i], yb = B[i][1];
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);
      dotB.setAttribute('cx', x); dotB.setAttribute('cy', yb);
      halo.setAttribute('cx', x); halo.setAttribute('cy', ya);
      dotA.setAttribute('cx', x); dotA.setAttribute('cy', ya);
      if (quiet) return;
      const o = offsetIn(card, svg);
      showTip(card, tipNodes(monLong(i), [
        { key: C.clay, value: partsText(moneyParts(v.rev[i])), label: t.tr.s1 },
        { key: C.prev, dotted: true, value: partsText(moneyParts(v.prev[i])), label: t.tr.s2 }
      ]), o.x + x, o.y + Math.min(ya, yb) - 8, o.y + Math.max(ya, yb) + 8);
      // the resting annotation must never sit on top of the headline figures
      if (i === last && !hovering && overlapsText(card, ['[data-v=kpi]', '[data-v=delta]', '.card-h'])) hideTip(card);
    };
    let hovering = false;
    svg.addEventListener('pointerenter', () => { hovering = true; });
    svg.addEventListener('pointerleave', () => { hovering = false; });
    svg.addEventListener('focus', () => { hovering = true; });
    svg.addEventListener('blur', () => { hovering = false; });
    const idxAt = cx => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.round((cx - r.left - padL) / step))); };
    svg.addEventListener('pointermove', e => { const i = idxAt(e.clientX); if (i !== cur) set(i); });
    svg.addEventListener('pointerdown', e => set(idxAt(e.clientX)));
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') set(last); });
    svg.addEventListener('keydown', e => {
      const i = keyStep(e, cur, n);
      if (i === null) return;
      if (i < 0) { set(last, true); hideTip(card); return; }
      set(i); announce(card);
    });
    svg.addEventListener('blur', () => set(last));
    card._reset = () => { if (svg.isConnected) set(last); };
    if (animate) { hideTip(card); set(last, true); setTimeout(() => { if (svg.isConnected && cur === last) set(last); }, 1150); }
    else set(last);
  }
  function renderTr(v, animate) {
    const card = $('#c-tr'), t = L();
    const s = sum(v.rev), p = sum(v.prev);
    fillFig($('[data-v=kpi]', card), moneyParts(s));
    deltaNode($('[data-v=delta]', card), (s / p - 1) * 100, 1, '%', t.tr.vs);
    fillTable($('[data-v=table]', card), t.tr.t, t.tr.th, v.rev.map((x, i) => [monLong(i), partsText(moneyParts(x)), partsText(moneyParts(v.prev[i]))]));
    drawTr(v, animate);
  }

  /* ---------- 베스트셀러 ---------- */
  const ARROW_UP = 'M3 9L9 3M4.4 3H9V7.6', ARROW_DOWN = 'M3 3L9 9M9 4.4V9H4.4', ARROW_FLAT = 'M2.5 6h7';
  function chgNode(cur, prev, t) {
    const chg = cur / prev - 1, dir = Math.abs(chg) < .0005 ? 'flat' : chg > 0 ? 'up' : 'down';
    return h('span', { class: 'chg ' + dir, 'aria-label': `${t.vs} ${nf(Math.abs(chg * 100), 1)}% ${t[dir]}` },
      sv('svg', { viewBox: '0 0 12 12', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' },
        sv('path', { d: dir === 'up' ? ARROW_UP : dir === 'down' ? ARROW_DOWN : ARROW_FLAT })),
      nf(Math.abs(chg * 100), 1) + '%');
  }
  function renderBs(v, animate) {
    const card = $('#c-bs'), t = L();
    const list = v.best.slice(0, state.more ? 10 : 5);
    $('[data-v=rows]', card).replaceChildren(...list.map((b, i) => h('li', { class: animate ? 'rise' : null, style: animate ? { animationDelay: (i * 40) + 'ms' } : null },
      h('span', { class: 'rk', text: String(i + 1).padStart(2, '0') }),
      h('span', { class: 'nm' }, h('span', { class: 'ttl', text: b[state.lang] }), h('span', { class: 'au', text: b['a_' + state.lang] })),
      h('span', { class: 'val' }, figNodes(countParts(b.c, t.bs.unit))),
      chgNode(b.c, b.p, t.bs))));
    const more = $('[data-v=more]', card);
    more.style.display = v.best.length > 5 ? '' : 'none';
    more.setAttribute('aria-expanded', String(state.more));
    $('[data-v=moreText]', card).textContent = state.more ? t.bs.less : t.bs.more;
  }

  /* ---------- 판매 채널 : single-hue bars ---------- */
  function renderCh(v, animate) {
    const card = $('#c-ch'), t = L(), total = sum(v.channels), max = Math.max(...v.channels);
    fillFig($('[data-v=kpi]', card), moneyParts(total));
    const rows = $('[data-v=rows]', card);
    rows.replaceChildren(...v.channels.map((val, i) => h('li', { 'data-i': i, class: animate ? 'fade' : null },
      h('span', { class: 'nm', text: t.ch.names[i] }),
      h('span', { class: 'bar' }, h('i', { style: { width: (val / max * 100).toFixed(1) + '%' } })),
      h('span', { class: 'val' }, figNodes(moneyParts(val))),
      h('span', { class: 'pct', text: nf(val / total * 100) + '%' }))));
    rows.setAttribute('aria-label', t.ch.aria);
    fillTable($('[data-v=table]', card), t.ch.t, t.ch.th, v.channels.map((val, i) => [t.ch.names[i], partsText(moneyParts(val)), nf(val / total * 100, 1) + '%']));
  }
  function bindCh() {
    const card = $('#c-ch'), rows = $('[data-v=rows]', card);
    let cur = -1;
    const focus = i => {
      $$('li', rows).forEach((li, k) => { li.classList.toggle('dim', i >= 0 && k !== i); $('.bar i', li).classList.toggle('on', k === i); });
    };
    const tip = i => {
      const v = state.view, t = L(), li = $$('li', rows)[i], el = $('.bar', li), o = offsetIn(card, el), total = sum(v.channels);
      showTip(card, tipNodes(t.ch.names[i], [{ key: C.clay, dot: true, value: partsText(moneyParts(v.channels[i])), label: nf(v.channels[i] / total * 100, 1) + '%' }]), o.x + o.w * Math.min(1, v.channels[i] / Math.max(...v.channels)) / 2, o.y - 6, o.y + o.h + 6);
    };
    rows.addEventListener('pointerover', e => { const li = e.target.closest('li[data-i]'); if (!li) return; focus(+li.dataset.i); tip(+li.dataset.i); });
    rows.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { focus(-1); hideTip(card); } });
    rows.addEventListener('keydown', e => {
      const i = keyStep(e, cur < 0 ? 0 : cur, 4);
      if (i === null) return;
      cur = cur < 0 && i >= 0 && e.key !== 'Home' && e.key !== 'End' ? 0 : i;
      focus(cur);
      if (cur < 0) { hideTip(card); return; }
      tip(cur); announce(card);
    });
    rows.addEventListener('focus', () => { cur = 0; focus(0); tip(0); });
    rows.addEventListener('blur', () => { cur = -1; focus(-1); hideTip(card); });
    card._reset = () => { focus(-1); hideTip(card); };
  }

  /* ---------- 판형별 매출 : stacked bar ---------- */
  function renderFm(v, animate) {
    const card = $('#c-fm'), t = L(), total = sum(v.formats);
    fillFig($('[data-v=kpi]', card), moneyParts(total));
    $$('[data-v=stack] i', card).forEach((seg, i) => { seg.style.flexGrow = String(v.formats[i]); seg.style.background = CF[i]; });
    $('[data-v=rows]', card).replaceChildren(...v.formats.map((val, i) => h('li', { 'data-i': i, class: animate ? 'fade' : null },
      h('span', { class: 'nm' }, h('i', { class: 'k-dot', style: { '--c': CF[i] } }), t.fm.names[i]),
      h('span', { class: 'val' }, figNodes(moneyParts(val))),
      h('span', { class: 'pct', text: nf(val / total * 100) + '%' }))));
    $('[data-v=stack]', card).setAttribute('aria-label', t.fm.aria);
    fillTable($('[data-v=table]', card), t.fm.t, t.fm.th, v.formats.map((val, i) => [t.fm.names[i], partsText(moneyParts(val)), nf(val / total * 100, 1) + '%']));
  }
  function bindFm() {
    const card = $('#c-fm'), stack = $('[data-v=stack]', card);
    const focus = i => {
      stack.classList.toggle('dim', i >= 0);
      $$('i', stack).forEach((s, k) => s.classList.toggle('on', k === i));
      $$('[data-v=rows] li', card).forEach((li, k) => li.classList.toggle('dim', i >= 0 && k !== i));
    };
    let cur = -1;
    const segTip = i => {
      const v = state.view, t = L(), el = $$('i', stack)[i], o = offsetIn(card, el), total = sum(v.formats);
      showTip(card, tipNodes(t.fm.names[i], [{ key: CF[i], dot: true, value: partsText(moneyParts(v.formats[i])), label: nf(v.formats[i] / total * 100, 1) + '%' }]), o.x + o.w / 2, o.y - 4, o.y + o.h + 4);
    };
    card.addEventListener('pointerover', e => {
      const el = e.target.closest('[data-i]');
      if (!el) return;
      const i = +el.dataset.i;
      focus(i);
      if (el.parentNode === stack) segTip(i); else hideTip(card);
    });
    stack.addEventListener('keydown', e => {
      const i = keyStep(e, cur < 0 ? 0 : cur, 3);
      if (i === null) return;
      cur = cur < 0 && i >= 0 && e.key !== 'Home' && e.key !== 'End' ? 0 : i;
      focus(cur);
      if (cur < 0) { hideTip(card); return; }
      segTip(cur); announce(card);
    });
    stack.addEventListener('focus', () => { cur = 0; focus(0); segTip(0); });
    stack.addEventListener('blur', () => { cur = -1; focus(-1); hideTip(card); });
    card.addEventListener('pointerout', e => {
      if (e.pointerType !== 'mouse') return;
      if (!e.relatedTarget || !card.contains(e.relatedTarget) || !e.relatedTarget.closest('[data-i]')) { focus(-1); hideTip(card); }
    });
    card._reset = () => { focus(-1); hideTip(card); };
  }

  /* ---------- 신간 성과 : dark table ---------- */
  function renderRel(v, animate) {
    const t = L(), table = $('#releases [data-v=table]');
    $('thead', table).replaceChildren(h('tr', null, t.rel.th.map((x, j) => h('th', { scope: 'col', class: j >= 4 && j <= 6 ? 'num' : null, text: x }))));
    $('tbody', table).replaceChildren(...v.rel.map((r, i) => {
      const rate = r.sold / r.first * 100;
      return h('tr', { class: animate ? 'fade' : null, style: animate ? { animationDelay: (i * 50) + 'ms' } : null },
        h('th', { scope: 'row', class: 'ttl', text: r[state.lang] }),
        h('td', { class: 'au', text: r['a_' + state.lang] }),
        h('td', { class: 'imp', text: t.imprint[r.k] }),
        h('td', { class: 'mono', text: r.date }),
        h('td', { class: 'num' }, figNodes(countParts(r.first, t.rel.unit))),
        h('td', { class: 'num' }, figNodes(countParts(r.sold, t.rel.unit))),
        h('td', { class: 'num' }, h('span', { class: 'sell' }, h('i', null, h('b', { style: { width: Math.min(100, rate).toFixed(1) + '%' } })), h('span', { text: nf(rate) + '%' }))),
        h('td', null, h('span', { class: 'rep' + (r.reprint ? '' : ' no'), text: r.reprint ? t.rel.yes : t.rel.no })));
    }));
  }

  /* ---------- i18n + render ---------- */
  function applyLang() {
    const t = L();
    document.documentElement.lang = state.lang;
    document.title = t.docTitle;
    $$('[data-i18n]').forEach(e => { const val = e.dataset.i18n.split('.').reduce((o, k) => o && o[k], t); if (typeof val === 'string') e.textContent = val; });
    $('.vz-tabs').setAttribute('aria-label', t.tabsLabel);
    $$('.vz-tab').forEach(b => { b.textContent = t.tabs[b.dataset.imprint]; b.setAttribute('aria-pressed', String(b.dataset.imprint === state.imprint)); });
    $$('.vz-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  }
  function renderAll(animate) {
    const v = state.view = getView(state.imprint);
    renderStatement(v); renderKpis(v); renderTr(v, animate); renderBs(v, animate);
    renderCh(v, animate); renderFm(v, animate); renderRel(v, animate);
  }

  function init() {
    bindCh(); bindFm();
    applyLang();
    void document.body.offsetWidth; // commit the empty bars so the first growth animates
    renderAll(true);

    $$('.vz-tab').forEach(b => b.addEventListener('click', () => {
      if (state.imprint === b.dataset.imprint) return;
      state.imprint = b.dataset.imprint; state.more = false; applyLang(); renderAll(true);
    }));
    $$('.vz-lang button').forEach(b => b.addEventListener('click', () => {
      if (state.lang === b.dataset.lang) return;
      state.lang = b.dataset.lang; applyLang(); renderAll(false);
    }));
    $('#c-bs [data-v=more]').addEventListener('click', () => { state.more = !state.more; renderBs(state.view, true); });
    $('.pill-ink').addEventListener('click', e => { e.preventDefault(); $('#releases').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); });
    document.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      $$('.card').forEach(card => { if (card._reset && !card.contains(e.target)) card._reset(); });
    });
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(entries => {
        if (!state.view) return;
        entries.forEach(en => {
          const box = en.target, w = Math.round(box.clientWidth), hh = Math.round(box.clientHeight);
          if (w === box._w && hh === box._h) return;
          drawTr(state.view, false);
        });
      });
      $$('[data-chart]').forEach(el => ro.observe(el));
    }
  }
  init();
})();
</script>
</body>
