<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Anthropic style · Publisher sales report sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<script src="/lib/embed.js" defer></script>
<style>
  /* Anthropic style (Vizney Styles 01) — Ivory, Editorial, Quiet · 아이보리, 에디토리얼, 고요함
     anthropic.com · claude.com의 공개 디자인에서 읽어 낸 참고용 스타일. 공식 디자인이 아니며 로고·서체·데이터는 쓰지 않는다.
     가상 출판사(Slow Moon Press)의 월간 판매 보고. 앤트로픽이 데이터를 보여 주는 방식(리서치 글: 런인 문장 → Key findings →
     결과를 말하는 제목의 figure와 Note 캡션 → 잉크 괘선 표 → 주석)을 대시보드로 옮겼다. DASHBOARD.md의 참고 화면이자 커버의 원본. */
  :root{
    --canvas:#faf9f5; --card:#f5f4ed; --card-2:#f0eee6; --plot:#fff; --tint:#e4edf8;
    --ink:#141413; --ink-2:#30302e; --body:#3d3d3a; --text-2:#5e5d59; --muted:#87867f; --cloud:#b0aea5;
    --hair:#e8e6dc; --hair-2:#dedcd1; --grid:#e8e6dc; --on-dark:#faf9f5; --on-dark-2:#9c9a92; --dark-2:#1f1e1d; --hair-dark:#30302e;
    --sky:#4f86c4; --sky-text:#2e6cae; --fig:#b8456e; --fig-text:#a63c62; --amber:#a8862a; --amber-text:#80661a;
    --comp:#87867f; --clay:#d97757; --clay-deep:#c6613f; --good:#4e7a30; --bad:#b0453b; --focus:#2c84db;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.165,.84,.44,1);
    --r:16px; --r-sm:10px; --gap:16px; --pad:28px; --page:32px;
  }
  /* 언어마다 서체 하나씩: 영어 Inter · Source Serif 4, 한국어 Noto Sans KR · Noto Serif KR(브랜드의 한국어 페이지가 쓰는 서체) */
  html[lang="ko"]{
    --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --serif:'Noto Serif KR','AppleMyungjo','Batang',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  html[lang="ko"] body{word-break:keep-all}
  p,h1,h2,h3,ul,ol,dl{margin:0}
  button{font:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .page{max-width:1400px;margin:0 auto;padding:0 var(--page) 0}

  /* ---------- 머리 84px: 회사 이름, 기간 알약, 언어, 버튼 2개(tertiary · primary, 모서리 10px) ---------- */
  .head{display:flex;align-items:center;gap:12px;min-height:84px;padding:14px 0}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand-n{font-size:16px;font-weight:600;letter-spacing:-.005em;color:var(--ink);white-space:nowrap}
  .brand-s{font-size:13px;color:var(--text-2);white-space:nowrap}
  .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:var(--card);font-size:13px;letter-spacing:.01em;color:var(--body);white-space:nowrap;text-decoration:none}
  .pill svg{color:var(--muted);flex:none}
  .lang{display:inline-flex;height:28px;padding:3px;border-radius:999px;border:1px solid var(--hair);background:var(--card)}
  .lang button{border:0;background:none;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--text-2);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}
  .btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;font-size:14px;font-weight:500;line-height:1;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background-color .22s var(--ease),border-color .22s var(--ease)}
  .btn svg{width:15px;height:15px;flex:none}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--on-dark)}
  .btn-primary:hover{background:var(--body);border-color:var(--body)}
  .btn-secondary{background:var(--hair);border-color:var(--hair-2);color:var(--ink-2)}
  .btn-secondary:hover{background:var(--hair-2)}
  .btn-tertiary{background:var(--card);border-color:var(--hair);color:var(--body)}
  .btn-tertiary:hover{background:var(--hair)}

  /* ---------- 필터 한 줄: 알약(사이트 내비와 같은 모양), 모든 그림·표·카드에 적용 ---------- */
  .filter{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;padding:12px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:28px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:var(--card);font-size:13px;color:var(--body);cursor:pointer;white-space:nowrap;transition:background-color .22s var(--ease),color .22s var(--ease)}
  .tab:hover{background:var(--hair)}
  .tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-dark)}
  .aside{font-size:13px;color:var(--text-2)}

  /* ---------- 제목 블록: 메타 행 → 런인 문장(산세리프 굵게 + 세리프) → 절 내비 "(1) Revenue" ---------- */
  .title{padding:30px 0 22px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 26px;font-size:13px;letter-spacing:.01em}
  .meta div{display:flex;gap:6px}
  .meta dt{color:var(--ink)} .meta dd{margin:0;color:var(--text-2)}
  .stmt{margin-top:18px;max-width:1120px;font-family:var(--serif);font-size:clamp(23px,2.6vw,36px);font-weight:400;line-height:1.28;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
  .stmt b{font-family:var(--font);font-weight:600;letter-spacing:-.012em}
  .stmt i{font-style:normal;white-space:nowrap}
  html[lang="en"] .stmt i{font-style:italic}
  .secnav{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;margin-top:22px}
  .secnav ol{display:flex;flex-wrap:wrap;gap:4px 22px;list-style:none;padding:0}
  .secnav a{font-size:14px;color:var(--ink);text-decoration:none}
  .secnav a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair-2)}
  .secnav .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:5px}
  .rid{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .rid code{margin-left:8px;font-family:var(--mono);font-size:12px;letter-spacing:0;text-transform:none;color:var(--text-2)}
  html[lang="ko"] .rid{letter-spacing:.04em}

  /* ---------- 카드(사이트의 카드: #f5f4ed, 16px, 패딩 32, 테두리·그림자 없음) ---------- */
  .card{position:relative;min-width:0;display:flex;flex-direction:column;padding:var(--pad);border-radius:var(--r);background:var(--card)}
  .lbl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  html[lang="ko"] .lbl{letter-spacing:.06em}
  .card-t{margin-top:8px;font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.005em;color:var(--ink);text-wrap:pretty}
  .note{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--text-2)}
  .note b{font-weight:600;color:var(--text-2)}

  /* Key findings: 왼쪽 세리프 불릿, 오른쪽 헤어라인 키–값 행(사이트 카드의 "Model Details — Haiku →" 행) */
  .findings{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px 48px}
  .findings h3{font-size:19px;font-weight:700;line-height:1.3;color:var(--ink)}
  .kf ul{margin-top:10px;padding-left:20px;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink)}
  .kf li+li{margin-top:6px}
  .kf li::marker{color:var(--muted)}
  .kv{list-style:none;padding:0;align-self:center}
  .kv li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;column-gap:14px;padding:10px 0;border-top:1px solid var(--hair-2)}
  .kv li:first-child{border-top:0;padding-top:0}
  .kv li:last-child{padding-bottom:0}
  .kv .k{font-size:14px;color:var(--ink)}
  .kv .v{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .kv .v .u{font-size:12.5px;font-weight:400;color:var(--text-2);margin-left:2px}
  .kv .v .u.pre{margin:0 1px 0 0}
  .kv .d{min-width:132px;text-align:right;font-size:12.5px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .kv .d b{font-weight:600;color:var(--good);margin-right:4px}
  .kv .d b.bad{color:var(--bad)} .kv .d b.flat{color:var(--text-2)}

  /* ---------- 그림: FIGURE 라벨 → 결과를 말하는 제목 → 흰 플롯 패널 → Note 캡션 ---------- */
  .grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr));margin-top:var(--gap)}
  .span7{grid-column:span 7} .span5{grid-column:span 5}
  .plot{position:relative;flex:1 1 auto;min-height:250px;margin-top:14px;border-radius:12px;background:var(--plot)}
  .plot > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
  .ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
  .ax.em{fill:var(--ink)}
  .axt{font-size:11px;fill:var(--text-2)}
  .end{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .end .v{font-weight:400;fill:var(--text-2)}
  .ref{font-size:11px;fill:var(--text-2)}
  /* 툴팁: 앱처럼 잉크 바탕에 아이보리 글자 */
  .tip{position:absolute;z-index:6;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--on-dark);border-radius:8px;padding:8px 11px 9px;box-shadow:0 4px 16px rgba(20,20,19,.12);white-space:nowrap;opacity:0;transition:opacity .14s ease}
  .tip.on{opacity:1}
  .tip::after{content:"";position:absolute;width:9px;height:9px;background:var(--ink)}
  .tip[data-side="above"]::after{left:var(--ax);bottom:0;transform:translate(-50%,50%) rotate(45deg)}
  .tip[data-side="below"]::after{left:var(--ax);top:0;transform:translate(-50%,-50%) rotate(225deg)}
  .tip[data-side="left"]::after{top:var(--ay);right:0;transform:translate(50%,-50%) rotate(-45deg)}
  .tip[data-side="right"]::after{top:var(--ay);left:0;transform:translate(-50%,-50%) rotate(135deg)}
  .tip-h{font-size:11px;color:var(--on-dark-2);margin-bottom:3px}
  .tip-r{display:flex;align-items:center;gap:7px;line-height:1.55}
  .tip-r i{width:14px;height:0;flex:none;border-top:2px solid var(--c);border-radius:2px}
  .tip-r i.dashed{border-top-style:dashed}
  .tip-r b{font-size:13px;font-weight:600;color:var(--on-dark);font-variant-numeric:tabular-nums}
  .tip-r span{font-size:11.5px;color:var(--on-dark-2)}

  /* ---------- 표: 1px 잉크 괘선, 그룹 라벨 행, 주인공 열(10월)은 연한 바탕과 색 윗선 ---------- */
  .tbl-wrap{margin-top:14px;overflow-x:auto;scrollbar-width:thin}
  .tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  .tbl th,.tbl td{padding:8px 8px;text-align:left;font-weight:400;border-bottom:1px solid var(--ink);white-space:nowrap;vertical-align:baseline}
  .tbl thead th{font-weight:600;color:var(--ink);padding-top:0;padding-bottom:8px}
  .tbl th:first-child,.tbl td:first-child{padding-left:0}
  .tbl th:last-child,.tbl td:last-child{padding-right:0}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl td.num{color:var(--ink)}
  .tbl td.num .u{font-size:12px;color:var(--text-2);margin-left:1px}
  .tbl .subj{background:var(--tint);padding-left:10px!important}
  .tbl thead .subj{border-top:2px solid var(--sky)}
  .tbl .grp th{padding:12px 0 5px;font-size:12px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--hair-2)}
  .tbl .t-title{color:var(--ink)}
  .tbl .t-title .au{display:block;font-size:12px;line-height:1.3;color:var(--text-2)}
  .tbl tbody tr:last-child td,.tbl tbody tr:last-child th{border-bottom-color:var(--ink)}
  .tbl .chg{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .chg.up{color:var(--good)} .chg.down{color:var(--bad)} .chg.flat{color:var(--text-2)} .chg.none{color:var(--muted)}
  .sell{display:inline-flex;align-items:center;justify-content:flex-end;gap:10px}
  .sell i{display:block;width:56px;height:5px;border-radius:3px;background:var(--hair);overflow:hidden;flex:none}
  .sell i b{display:block;height:100%;border-radius:3px;background:var(--ink)}
  .sell span{min-width:38px;text-align:right}
  .badge{display:inline-flex;align-items:center;height:18px;margin-left:8px;padding:0 6px;border-radius:4px;border:1px solid var(--clay);font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--clay-deep);vertical-align:1px}

  /* ---------- 임프린트 카드 3장: 사이트 카드 해부 그대로(눈썹 → 제목 → 문장 → 키–값 행 → 전폭 보조 버튼) ---------- */
  .imprints{display:grid;gap:var(--gap);grid-template-columns:repeat(3,minmax(0,1fr));margin-top:var(--gap)}
  .imp{border-top:3px solid transparent}
  .imp.on{border-top-color:var(--c)}
  .imp .eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.01em;color:var(--text-2)}
  .imp .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .imp h3{margin-top:10px;font-size:21px;font-weight:700;line-height:1.25;color:var(--ink)}
  .imp .desc{margin-top:8px;min-height:42px;font-size:14px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
  .imp .kv{margin-top:18px;align-self:stretch}
  .imp .kv li{padding:9px 0;grid-template-columns:minmax(0,1fr) auto}
  .imp .kv li:first-child{border-top:1px solid var(--hair-2);padding-top:9px}
  .imp .kv .k{font-size:13.5px}
  .imp .kv .v{font-size:14px;font-weight:500}
  .imp .kv .d{min-width:0;margin-left:8px;display:inline}
  .imp .kv .d b{margin-right:0}
  .imp .vd{text-align:right;white-space:nowrap}
  .imp .kv{margin-bottom:18px}
  .imp .btn{margin-top:auto;justify-content:center;width:100%}

  /* ---------- 주석 카드 ---------- */
  .notes h3{font-size:19px;font-weight:700;line-height:1.3;color:var(--ink)}
  .notes ol{margin-top:10px;padding-left:18px;font-size:13px;line-height:1.55;color:var(--text-2)}
  .notes li+li{margin-top:6px}
  .notes li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
  .notes .src{margin-top:auto;padding-top:16px;font-size:13px;line-height:1.55;color:var(--text-2)}
  .notes .src b{font-weight:600;color:var(--ink)}
  .notes .upd{margin-top:6px;font-size:12.5px;color:var(--muted)}

  /* ---------- 바닥: 사이트의 잉크 푸터 자리. 카탈로그 줄, 샘플 안내, 고지 ---------- */
  .foot{margin:var(--gap) calc(var(--page) * -1) 0;padding:26px var(--page) 28px;background:var(--ink);color:var(--on-dark-2);font-size:12.5px;line-height:1.65}
  .foot-in{max-width:1336px;margin:0 auto}
  .foot p{max-width:100ch}
  .foot p + p{margin-top:6px}
  .foot .cat{font-weight:500;color:var(--on-dark)}
  .foot .cat a{color:inherit;text-decoration-color:var(--hair-dark);text-underline-offset:3px}
  .foot .cat a:hover{text-decoration-color:var(--on-dark)}
  .foot .cat .w{color:var(--on-dark-2);font-weight:400}
  .toast{position:fixed;left:50%;bottom:24px;z-index:9;transform:translate(-50%,8px);padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--on-dark);font-size:13px;box-shadow:0 4px 16px rgba(20,20,19,.16);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s var(--ease)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 움직임 ---------- */
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fade{animation:fade .45s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ---------- 임베드(?embed=1 · lib/embed.js): 포스트가 고지를 싣는다 ---------- */
  html.vz-embed .foot{display:none}
  html.vz-embed .page{padding-bottom:20px}
  @media print{.tools .btn,.lang{display:none}.foot{background:none;color:var(--text-2)}.foot .cat{color:var(--ink)}}

  /* ---------- 반응형 ---------- */
  @media (max-width:1359px){
    :root{--page:24px;--gap:14px;--pad:24px}
    .title{padding:26px 0 20px}
    .findings{gap:20px 36px}
  }
  @media (max-width:1199px){
    .span7,.span5{grid-column:span 6}
  }
  @media (max-width:1023px){
    .span7,.span5{grid-column:span 12}
    .plot{min-height:260px}
  }
  @media (max-width:899px){
    .head{min-height:64px;padding:10px 0}
    .brand-s,#btnPdf{display:none}
    .filter .aside{display:none}
    .findings{grid-template-columns:minmax(0,1fr)}
    .kv{align-self:stretch}
    .imprints{grid-template-columns:minmax(0,1fr)}
    .imp .btn{width:auto;align-self:flex-start}
  }
  @media (max-width:639px){
    :root{--page:16px;--gap:12px;--pad:20px}
    .tools{gap:6px}
    .pill-period,#btnMd{display:none}
    .title{padding:22px 0 18px}
    .stmt{margin-top:14px;font-size:22px}
    .secnav{margin-top:16px}
    .rid{display:none}
    .kv li{grid-template-columns:minmax(0,1fr) auto}
    .kv .d{min-width:0;grid-column:1/-1;margin-top:-4px;text-align:right}
    .tbl .c-chg{display:none}
    .tbl .t-title{white-space:normal}
    .sell i{width:48px}
    .plot{min-height:230px}
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">

    }
    // 선
    const pts = opt.series.map(s => s.vals.map((val, i) => [X(i), Y(val)]));
    opt.series.forEach((s, si) => {
      const d = pts[si].map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
      svg.append(sv('path', { d, fill: 'none', stroke: s.color, 'stroke-width': s.dashed ? 2 : 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        'stroke-dasharray': s.dashed ? '7 5' : null, pathLength: animate && !REDUCE && !s.dashed ? 1 : null, class: s.dashed ? fade(animate) : (animate && !REDUCE ? 'draw' : null) }));
      if (!s.dashed) svg.append(sv('circle', { cx: pts[si][last][0], cy: pts[si][last][1], r: 4, fill: C.plot, stroke: s.color, 'stroke-width': 2.5, class: fade(animate) }));
    });
    // 선 끝 라벨: 겹치면 위아래로 벌린다
    const lab = opt.series.map((s, si) => ({ s, y: pts[si][last][1] })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 16) lab[i].y = lab[i - 1].y + 16;
    const over = lab.length ? lab[lab.length - 1].y - (bottom + 4) : 0;
    if (over > 0) lab.forEach(l => { l.y -= over; });
    const g = sv('g', { class: fade(animate) });
    for (const l of lab) g.append(sv('text', { x: X(last) + 12, y: l.y, dy: '.35em', class: 'end', fill: l.s.textColor || C.ink },
      narrow ? null : sv('tspan', { text: l.s.name + ' ' }), sv('tspan', { class: narrow ? null : 'v', text: l.s.endText })));
    svg.append(g);
    // 호버·키보드로 고른 달
    const cross = sv('line', { y1: top - 4, y2: bottom, stroke: C.hair2, 'stroke-width': 1 });
    const dots = opt.series.map(s => sv('circle', { r: 4.5, fill: C.plot, stroke: s.color, 'stroke-width': 2.5 }));
    const hl = sv('g', { style: { opacity: 0 } }, cross, dots);
    svg.append(hl);
    svg.append(sv('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' }));
    box.replaceChildren(svg);

    const show = on => { hl.style.opacity = on ? 1 : 0; if (!on) hideTip(card); };
    const set = i => {
      box._cur = i;
      const x = X(i);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);
      dots.forEach((d, si) => { d.setAttribute('cx', x); d.setAttribute('cy', pts[si][i][1]); });
      show(true);
      const tip = $('.tip', card), o = offsetIn(card, svg), ys = pts.map(p => p[i][1]);
      tip.replaceChildren(...tipNodes(monLong(i), opt.series.map(s => ({ key: s.color, dashed: s.dashed, value: s.fmt(s.vals[i]), label: s.name }))));
      placeTip(card, o.x + x, o.y + Math.min(...ys) - 7, o.y + Math.max(...ys) + 7);
    };
    const idxAt = cx => { const r = svg.getBoundingClientRect(); return Math.max(0, Math.min(last, Math.round((cx - r.left - padL) / step))); };
    svg.addEventListener('pointermove', e => { const i = idxAt(e.clientX); if (i !== box._cur || hl.style.opacity !== '1') set(i); });
    svg.addEventListener('pointerdown', e => set(idxAt(e.clientX)));
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && document.activeElement !== svg) show(false); });
    svg.addEventListener('focus', () => set(box._cur == null ? last : box._cur));
    svg.addEventListener('blur', () => show(false));
    svg.addEventListener('keydown', e => {
      const i = keyStep(e, box._cur == null ? last : box._cur, n);
      if (i === null) return;
      if (i < 0) { show(false); return; }
      set(i);
      $('#live').textContent = `${monLong(i)}: ` + opt.series.map(s => `${s.name} ${s.fmt(s.vals[i])}`).join(', ');
    });
    card._reset = () => show(false);
    box._cur = last;
    hideTip(card);
  }

  /* ---------- 그림 1: 월 매출 ---------- */
  const revOpt = v => {
    const t = L(), s = sum(v.rev), p = sum(v.prev), vals = v.rev.concat(v.prev);
    const key = state.imprint === 'all' ? 'fic' : state.imprint;
    return {
      lo: Math.min(...vals) * .9, hi: Math.max(...vals) * 1.04, tick: moneyTick,
      aria: t.fig1.aria(partsText(moneyParts(s)), signed((s / p - 1) * 100, 1) + '%'),
      series: [
        { name: t.fig1.s1, vals: v.rev, color: SERIES[key].line, textColor: SERIES[key].text, endText: partsText(moneyParts(v.rev[11])), fmt: x => partsText(moneyParts(x)) },
        { name: t.fig1.s2, vals: v.prev, color: C.comp, textColor: C.ink, dashed: true, endText: partsText(moneyParts(v.prev[11])), fmt: x => partsText(moneyParts(x)) }
      ]
    };
  };
  function renderRev(v, animate) {
    const t = L(), above = v.rev.filter((x, i) => x > v.prev[i]).length;
    const name = state.imprint === 'all' ? (state.lang === 'ko' ? '전체' : 'Total') : t.tabs[state.imprint];
    $('#revTitle').textContent = t.fig1.t(above, name);
    $('#revNote').textContent = t.fig1.note;
    refade($('#revTitle'), animate);
    $('#revTable').replaceChildren(srTable(`${t.fig1.lbl} · ${t.tabs[state.imprint]}`, t.fig1.th,
      v.rev.map((x, i) => [monLong(i), partsText(moneyParts(x)), partsText(moneyParts(v.prev[i]))])));
    drawLines($('#c-rev'), $('#revPlot'), revOpt(v), animate);
  }

  /* ---------- 그림 2: 임프린트별 월 반품률 ---------- */
  const retOpt = v => {
    const t = L(), fmt = x => pct(x), ks = state.imprint === 'all' ? IMPRINTS : [state.imprint];
    const series = ks.map(k => { const d = DATA.imprints[k], vals = d.returned.map((r, i) => r / d.shipped[i] * 100);
      return { name: t.tabs[k], vals, color: SERIES[k].line, textColor: SERIES[k].text, endText: pct(vals[11]), fmt }; });
    if (state.imprint !== 'all') { const a = getView('all'); series.push({ name: t.fig2.all, vals: a.rr, color: C.comp, textColor: C.ink, dashed: true, endText: pct(a.rr[11]), fmt }); }
    const vals = series.flatMap(s => s.vals).concat(TARGET);
    return { lo: Math.min(...vals) - 1, hi: Math.max(...vals) + 1, tick: x => nf(x) + '%', ref: { val: TARGET, label: t.fig2.target },
      aria: t.fig2.aria(series.map(s => `${s.name} ${s.endText}`).join(', ')), series };
  };
  function renderRet(v, animate) {
    const t = L(), opt = retOpt(v);
    let title;
    if (state.imprint === 'all') {
      const st = IMPRINTS.map(impStats), rose = st.filter(s => s.rrd > 0).map(s => t.tabs[s.k]), eased = st.filter(s => s.rrd <= 0).map(s => t.tabs[s.k]);
      title = t.fig2.tAll(rose, eased);
    } else title = t.fig2.tOne(t.tabs[state.imprint], pct(v.rr[11]), v.rr[11] < v.rr[10]);
    $('#retTitle').textContent = title;
    $('#retNote').textContent = t.fig2.note;
    refade($('#retTitle'), animate);
    $('#retTable').replaceChildren(srTable(`${t.fig2.lbl} · ${t.tabs[state.imprint]}`, t.fig2.th.concat(opt.series.map(s => s.name)),
      DATA.months.map((m, i) => [monLong(i)].concat(opt.series.map(s => pct(s.vals[i]))))));
    drawLines($('#c-ret'), $('#retPlot'), opt, animate);
    return title;
  }

  /* ---------- 표 1: 상위 도서(잉크 괘선, 그룹 라벨 행, 10월 열이 주인공) ---------- */
  function chgNode(cur, prev, t) {
    if (prev == null) return h('span', { class: 'chg none', 'aria-label': t.none, text: '—' });
    const d = (cur / prev - 1) * 100, shown = Number(d.toFixed(1)), dir = shown === 0 ? 'flat' : shown > 0 ? 'up' : 'down';
    return h('span', { class: 'chg ' + dir, 'aria-label': `${nf(Math.abs(shown), 1)}% ${t[dir]}` }, signed(shown, 1) + '%');
  }
  function titleRow(b, t, animate, i) {
    const thru = b.sold / b.printed * 100, fresh = b.pub >= '2026-10-01';
    return h('tr', { class: fade(animate), style: animate && !REDUCE ? { animationDelay: (i * 40) + 'ms' } : null },
      h('th', { scope: 'row', class: 't-title' }, book(b.id, 'title'), h('span', { class: 'au', text: book(b.id, 'author') }), fresh ? h('span', { class: 'badge', text: t.fresh }) : null),
      h('td', { class: 'num subj' }, figNodes(countParts(b.oct, t.unit))),
      h('td', { class: 'num c-chg' }, chgNode(b.oct, b.sep, t)),
      h('td', { class: 'num', 'aria-label': `${nf(thru)}%` },
        h('span', { class: 'sell', 'aria-hidden': 'true' }, h('i', null, h('b', { style: { width: Math.min(100, thru).toFixed(1) + '%' } })), h('span', { text: nf(thru) + '%' }))));
  }
  function renderTitles(v, animate) {
    const t = L().tbl1, table = $('#titlesTable');
    const COLS = ['', 'num subj', 'num c-chg', 'num'];
    $('thead', table).replaceChildren(h('tr', null, t.th.map((x, j) => h('th', { scope: 'col', class: COLS[j] || null, text: x }))));
    const rows = [];
    if (state.imprint === 'all') {
      for (const k of IMPRINTS) {
        const ts = DATA.imprints[k].titles.slice().sort((a, b) => b.oct - a.oct);
        rows.push(h('tr', { class: 'grp' }, h('th', { scope: 'colgroup', colspan: 4, text: t.grp(L().tabs[k], 2, ts.length) })));
        ts.slice(0, 2).forEach((b, i) => rows.push(titleRow({ ...b, k }, t, animate, rows.length)));
      }
    } else v.titles.forEach((b, i) => rows.push(titleRow(b, t, animate, i)));
    $('tbody', table).replaceChildren(...rows);
    $('#titlesCount').textContent = t.count(v.titles.length);
    $('#titlesNote').textContent = t.note;
  }

  /* ---------- 임프린트 카드 3장 ---------- */
  function renderImprints(animate) {
    const t = L(), box = $('#s-imprints');
    box.replaceChildren(...IMPRINTS.map((k, i) => {
      const s = impStats(k), on = state.imprint === k;
      const rows = [
        [t.imp.rows[0], moneyParts(s.rev), deltaNodes(s.yoy, 1, '%', '')],
        [t.imp.rows[1], countParts(s.copies, t.kv.unit), deltaNodes(s.cp, 1, '%', '')],
        [t.imp.rows[2], [{ t: nf(s.rr, 1) }, { t: '%', u: 1 }], deltaNodes(s.rrd, 1, t.kv.pts, '', false)],
        [t.imp.rows[3], [{ t: nf(s.dig, 1) }, { t: '%', u: 1 }], []]
      ];
      const btn = h('button', { type: 'button', class: 'btn ' + (on ? 'btn-primary' : 'btn-secondary'), 'data-k': k }, on ? t.imp.close : t.imp.open,
        sv('svg', { viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }, sv('path', { d: on ? 'M13 8H3M7 4 3 8l4 4' : 'M3 8h10M9 4l4 4-4 4' })));
      btn.addEventListener('click', () => { select(on ? 'all' : k); $('#tab-' + (on ? 'all' : k)).focus({ preventScroll: true }); });
      return h('article', { class: 'card imp' + (on ? ' on' : '') + (fade(animate) ? ' fade' : ''), style: { '--c': SERIES[k].line, animationDelay: animate && !REDUCE ? (i * 50) + 'ms' : null }, 'aria-current': on ? 'true' : null },
        h('p', { class: 'eyebrow' }, h('i', { 'aria-hidden': 'true' }), t.imp.eyebrow),
        h('h3', { text: t.tabs[k] }),
        h('p', { class: 'desc', text: t.imp.desc(moneyLong(s.rev), pct(Math.abs(s.yoy)), s.yoy >= 0, nf(s.copies)) }),
        h('ul', { class: 'kv' }, rows.map(([kk, parts, d]) => h('li', null, h('span', { class: 'k', text: kk }), h('span', { class: 'vd' }, h('span', { class: 'v' }, figNodes(parts)), d.length ? h('span', { class: 'd' }, d) : null)))),
        btn);
    }));
  }

  /* ---------- 주석 ---------- */
  function renderNotes() {
    const t = L().notes;
    $('#notesList').replaceChildren(...t.items.map(x => h('li', { text: x })));
    $('#notesSrc').textContent = t.src;
  }

  /* ---------- 마크다운으로 복사 · PDF ---------- */
  function toMarkdown(v, stmtParts, kf, retTitle) {
    const t = L(), lines = [];
    lines.push(`# ${t.md.title}`, '', richText(stmtParts), '', `## ${t.kf.t}`, '');
    kf.forEach(p => lines.push(`- ${richText(p)}`));
    lines.push('', `## ${t.md.figures} · ${t.tabs[state.imprint]}`, '', '| | | |', '|---|---:|---|');
    kvRows(v).forEach(([k, parts, d]) => lines.push(`| ${k} | ${partsText(parts)} | ${d.map(x => x.textContent || x).join(' ')} |`));
    lines.push('', `## ${t.md.titles}`, '', `| ${t.tbl1.th.join(' | ')} |`, '|---|---:|---:|---:|');
    v.titles.forEach(b => lines.push(`| ${book(b.id, 'title')} (${book(b.id, 'author')}) | ${nf(b.oct)} | ${b.sep == null ? '—' : signed((b.oct / b.sep - 1) * 100, 1) + '%'} | ${nf(b.sold / b.printed * 100)}% |`));
    lines.push('', `## ${t.md.imprints}`, '', `| | ${t.imp.rows.join(' | ')} |`, '|---|---:|---:|---:|---:|');
    IMPRINTS.map(impStats).forEach(s => lines.push(`| ${t.tabs[s.k]} | ${moneyLong(s.rev)} (${signed(s.yoy, 1)}%) | ${nf(s.copies)} (${signed(s.cp, 1)}%) | ${pct(s.rr)} (${signed(s.rrd, 1)}${t.kv.pts}) | ${pct(s.dig)} |`));
    lines.push('', `## ${t.fig2.lbl}`, '', retTitle, '', `## ${t.md.notes}`, '');
    t.notes.items.forEach((x, i) => lines.push(`${i + 1}. ${x}`));
    lines.push('', t.notes.src, '', t.note, t.notice, '');
    return lines.join('\n');
  }
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
  }
  $('#btnMd').addEventListener('click', async () => {
    const md = state.md;
    try { await navigator.clipboard.writeText(md); } catch (e) {
      const ta = h('textarea', { class: 'sr-only', text: md }); document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast(L().copied);
  });
  $('#btnPdf').addEventListener('click', () => window.print());

  /* ================= 필터(임프린트 알약) ================= */
  const KEYS = ['all'].concat(IMPRINTS);
  const tabsEl = $('#tabs');
  for (const k of KEYS) {
    const b = h('button', { type: 'button', class: 'tab', id: 'tab-' + k, role: 'tab', 'aria-controls': 'panel', 'data-k': k });
    b.addEventListener('click', () => select(k));
    tabsEl.append(b);
  }
  tabsEl.addEventListener('keydown', e => {
    const idx = KEYS.indexOf(state.imprint);
    const next = { ArrowRight: idx + 1, ArrowLeft: idx - 1, Home: 0, End: KEYS.length - 1 }[e.key];
    if (next == null) return;
    e.preventDefault();
    const k = KEYS[(next + KEYS.length) % KEYS.length];
    select(k);
    $('#tab-' + k).focus();
  });
  function syncTabs() {
    for (const b of $$('.tab', tabsEl)) {
      const on = b.dataset.k === state.imprint;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    }
    $('#panel').setAttribute('aria-labelledby', 'tab-' + state.imprint);
  }

  /* ================= 언어와 그리기 ================= */
  function applyLang() {
    const t = L();
    document.documentElement.lang = state.lang;
    document.title = t.docTitle;
    for (const el of $$('[data-i18n]')) { const val = pick(t, el.dataset.i18n); if (typeof val === 'string') el.textContent = val; }
    for (const b of $$('.tab', tabsEl)) b.textContent = t.tabs[b.dataset.k];
    tabsEl.setAttribute('aria-label', t.tabsLabel);
    for (const b of $$('.lang button')) b.setAttribute('aria-pressed', b.dataset.lang === state.lang ? 'true' : 'false');
  }
  function renderAll(animate) {
    const v = state.view = getView(state.imprint);
    const stmt = renderTitle(v, animate), kf = renderFindings(v, animate);
    renderRev(v, animate); renderTitles(v, animate); renderImprints(animate);
    const retTitle = renderRet(v, animate); renderNotes();
    state.md = toMarkdown(v, stmt, kf, retTitle);
  }
  function select(k) {
    if (k === state.imprint) return;
    state.imprint = k;
    syncTabs();
    renderAll(true);
  }
  for (const b of $$('.lang button')) b.addEventListener('click', () => {
    if (b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang;
    applyLang();
    renderAll(false);
  });
  // 터치: 다른 곳을 누르면 차트의 고정된 점을 푼다
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    for (const card of [$('#c-rev'), $('#c-ret')]) if (card._reset && !card.contains(e.target)) card._reset();
  });

  syncTabs();
  applyLang();
  renderAll(true);
  const redraw = () => { if (!state.view) return; drawLines($('#c-rev'), $('#revPlot'), revOpt(state.view), false); drawLines($('#c-ret'), $('#retPlot'), retOpt(state.view), false); };
  if ('ResizeObserver' in window) {
    new ResizeObserver(() => {
      const a = $('#revPlot'), b = $('#retPlot');
      if (state.view && (Math.round(a.clientWidth) !== a._w || Math.round(a.clientHeight) !== a._h || Math.round(b.clientWidth) !== b._w || Math.round(b.clientHeight) !== b._h)) redraw();
    }).observe($('#panel'));
  }
  // 글꼴이 늦게 오면 글자 폭이 바뀌므로 차트를 한 번 더 그린다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
})();
</script>
</body>
</html>
