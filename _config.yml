title: Vizney Styles
description: Dashboard design specs (DASHBOARD.md) that AI coding agents, Tableau and Power BI can follow, with live samples.
exclude:
  - CLAUDE.md
  - README.md
  - tools
  - npm
# Every Markdown page (<name>/DASHBOARD.html, prompt.html, skill/SKILL.html) gets the site's header, tabs and footer.
# The HTML pages have no front matter, so Jekyll copies them as they are. (A glob path here is not applied on GitHub Pages.)
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: spec
