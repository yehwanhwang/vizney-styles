title: Vizney Styles
description: Dashboard design specs (DASHBOARD.md) that AI coding agents, Tableau and Power BI can follow, with live samples.
exclude:
  - CLAUDE.md
  - README.md
  - tools
  - npm
# Every style's spec page (<name>/DASHBOARD.html) gets the site's header, tabs and footer.
defaults:
  - scope:
      path: "*/DASHBOARD.md"
    values:
      layout: spec
