title: Vizney Styles
description: Dashboard design specs (DASHBOARD.md) that AI coding agents, Tableau and Power BI can follow, with live samples.
exclude:
  - CLAUDE.md
  - README.md
  - tools
  - npm
  # <name>/DASHBOARD.html is built by tools/package.py (the front matter's `layout` token would clash with Jekyll's).
  - "*/DASHBOARD.md"
# Every Markdown page (prompt.html, skill/SKILL.html) gets the site's header, tabs and footer.
# The HTML pages have no front matter, so Jekyll copies them as they are.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: spec
