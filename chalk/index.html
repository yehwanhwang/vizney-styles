<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Chalk · Order analytics sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/lib/embed.js" defer></script>
<script>
  // 캡처 모드(?shot=1): 포스터와 커버를 찍을 때 페이지 전용 요소(언어 토글, 하단 안내)를 숨기고 마지막 줄을 화면 끝까지 늘린다
  if (/[?&]shot=1(&|$)/.test(location.search)) document.documentElement.classList.add('vz-shot');
</script>
<style>
  /* Chalk — Pastel, calm, clean. · 파스텔톤, 차분함, 깔끔함.
     흰 바탕에 파스텔 KPI 카드, 가늘고 짙은 차트. 이 화면 하나가 라이브 샘플이자
     포스터(1080×1350)와 커버(1440×810)의 원본이다. 키 컬러·서체·사진은 데이터 카드 안에 들어간다. */
  :root{
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --display:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --ink:#161616; --ink-2:#474747; --muted:#8B8B8B; --faint:#A3A3A3;
    --surface:#FFFFFF; --border:#EAEAEA; --grid:#EFEFEF;
    --pill:#F1F1F1; --pill-hover:#E7E7E7; --pill-active:#D2E7F3;
    --k-blue:#D2E7F3; --k-green:#D9EEC8; --k-orange:#FEC48E; --k-dark:#2A2A2A;
    --good:#1E8449; --bad:#D0392B; --flat:#8B8B8B;
    --radius:12px;
  }
  /* 본문 서체는 언어마다 하나: 영어 Inter, 한국어 Pretendard */
  html[lang="ko"]{--font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font);font-size:13px;line-height:1.45;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  svg{flex:none}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .page{max-width:1240px;margin:0 auto;padding:40px 48px 44px}

  /* ---------- 머리: 시리즈 · 이름 · 세 단어 ---------- */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .eyebrow{margin:0;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--ink-2)}
  .head h1{margin:10px 0 0 -4px;font-family:var(--display);font-size:84px;line-height:.86;font-weight:700;letter-spacing:-.01em}
  .words{margin:12px 0 0;font-size:24px;line-height:1.3;font-weight:500;color:var(--ink-2)}
  .lang{display:flex;align-items:center;padding:3px;border-radius:8px;background:var(--pill)}
  .lang button{border:0;background:transparent;padding:4px 9px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---------- 필터: 아래 모든 카드에 함께 적용 ---------- */
  .tabs{display:flex;gap:8px;margin-top:24px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:34px;padding:0 16px;border:0;border-radius:8px;background:var(--pill);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
  .tab:hover{background:var(--pill-hover)}
  .tab[aria-selected="true"]{background:var(--pill-active);color:var(--ink);font-weight:700}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin:18px 0 10px}
  .sec-head h2{margin:0;font-size:15px;font-weight:700}
  .period{color:var(--muted)}

  /* ---------- KPI: 지표명 → 수치(가깝게) → 증감(한 칸 띄워서) ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .kpi{padding:16px 20px 18px;border-radius:var(--radius);display:flex;flex-direction:column}
  .kpi--blue{background:var(--k-blue)} .kpi--green{background:var(--k-green)}
  .kpi--orange{background:var(--k-orange)} .kpi--dark{background:var(--k-dark);color:#fff}
  .kpi__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .kpi__label{font-size:13px;font-weight:500;color:var(--ink-2)}
  .kpi--dark .kpi__label{color:#C8C8C8}
  .kpi__icon{width:20px;height:20px}
  /* 지표명이 두 줄로 넘어가도 같은 줄 카드의 수치 높이가 맞도록 수치·증감은 카드 아래쪽에 붙인다 */
  .kpi__top{padding-bottom:6px}
  .kpi__main{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:auto}
  .kpi__value{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em;white-space:nowrap}
  .u{font-size:13px;font-weight:700;letter-spacing:0;margin-left:2px}
  .u.pre{margin:0 2px 0 0}
  .delta{display:inline-flex;align-items:center;gap:4px;padding:3px 7px 3px 6px;border-radius:6px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;line-height:1.25;white-space:nowrap}
  .delta svg,.chg svg{width:14px;height:14px}
  .is-good svg{color:var(--good)} .is-bad svg{color:var(--bad)} .is-flat svg{color:var(--flat)}
  .kpi__value,.delta{transition:opacity .14s ease,transform .14s ease}
  .kpi.is-swap .kpi__value,.kpi.is-swap .delta{opacity:0;transform:translateY(3px)}

  /* ---------- 카드 ---------- */
  .row{display:grid;gap:16px;margin-top:16px}
  .row-a{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .row-b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row-c{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{position:relative;min-width:0;min-height:0;padding:20px 22px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column}
  .card__head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-bottom:8px}
  .card__title{margin:0;font-size:15px;font-weight:700}
  .card__title small{margin-left:8px;font-size:13px;font-weight:500;color:var(--muted)}
  .legend{display:flex;gap:16px}
  .legend button{display:inline-flex;align-items:center;gap:7px;padding:2px 0;border:0;background:transparent;font-size:12px;font-weight:500;color:var(--ink-2);cursor:default}
  .legend__val{display:none;min-width:3.6em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .card.is-narrow .legend__val{display:inline}
  .card.is-narrow .lc-tip{display:none}
  .tip{position:absolute;top:0;left:0;min-width:146px;white-space:nowrap;padding:9px 12px 10px;border-radius:8px;background:#232323;color:#fff;font-size:12px;line-height:1.35;box-shadow:0 8px 20px rgba(0,0,0,.16);pointer-events:none}
  .tip__title{margin-bottom:6px;font-weight:700}
  .tip__row{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px}
  .tip__row + .tip__row{margin-top:3px}
  .tip__label{color:#BDBDBD}
  .tip__val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

  /* 시간대별 주문: 높이는 옆 카드(카테고리)에 맞춘다 */
  .lc{position:relative;flex:1;min-height:220px;touch-action:pan-y;border-radius:8px}
  .lc > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .lc text{font-family:var(--font)}
  .tick{font-size:12px;fill:var(--faint);font-variant-numeric:tabular-nums}
  .xtick{font-size:12px;fill:var(--muted)}
  .xtick.is-active{fill:var(--ink);font-weight:700}
  .ser,.endpt,.focus circle{transition:opacity .15s}
  .lc.emph-wd .ser-we,.lc.emph-wd .fd-we{opacity:.18}
  .lc.emph-we .ser-wd,.lc.emph-we .fd-wd,.lc.emph-we .endpt{opacity:.18}
  .lc-tip{transition:transform .08s linear}

  /* 카테고리별 주문 */
  .gauge-body{flex:1;display:grid;align-content:center;justify-items:center;gap:12px}
  .ring{position:relative;width:100%;max-width:164px}
  .ring svg{display:block;width:100%;height:auto;overflow:visible}
  .ring .seg{transition:opacity .15s}
  .ring.has-focus .seg:not(.is-on){opacity:.22}
  .ring__center{position:absolute;left:0;right:0;top:57.14%;transform:translateY(-50%);text-align:center;pointer-events:none}
  .ring__label{font-size:12px;font-weight:500;color:var(--muted)}
  .ring__value{font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
  .cat-legend{width:100%;max-width:300px;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
  .cat-legend li{transition:opacity .15s}
  .cat-legend.has-focus li:not(.is-on){opacity:.4}
  .cat-legend button{width:100%;display:grid;grid-template-columns:11px minmax(0,1fr);column-gap:9px;row-gap:1px;padding:2px 6px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:default}
  .cat-legend .dot{width:11px;height:11px;border-radius:50%;align-self:center}
  .cat-legend .name{font-size:13px;font-weight:700}
  .cat-legend .val{grid-column:2;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* 인기 상품 */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{text-align:left;font-weight:400}
  .tbl thead th{padding:0 0 8px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border)}
  .tbl tbody th,.tbl tbody td{padding:6px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
  .tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0;padding-bottom:2px}
  .tbl .rank{width:30px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tbl .name{font-weight:700;padding-right:12px}
  .tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tbl td.num + td.num{width:84px}
  .chg{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;font-weight:700;vertical-align:top}

  /* 채널별 매출: 필터한 채널만 짙게 */
  .bars{position:relative;flex:1;margin:0;padding:6px 0 4px;list-style:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
  .bar{display:grid;grid-template-columns:112px minmax(0,1fr) 54px;align-items:center;gap:14px;padding:3px 0;border-radius:6px;cursor:default}
  .bar__name{font-weight:700;white-space:nowrap;transition:color .2s}
  .bar__track{height:10px;border-radius:5px;background:var(--grid)}
  .bar__fill{height:100%;border-radius:5px;background:#1A1A1A;transition:width .48s cubic-bezier(.2,.7,.2,1),background .2s}
  .bar__val{text-align:right;font-variant-numeric:tabular-nums;transition:color .2s}
  .bar.is-dim .bar__name,.bar.is-dim .bar__val{color:var(--muted)}
  .bar.is-dim .bar__fill{background:#CFCFCF}
  .bar-tip{opacity:0;transition:opacity .12s}
  .bar-tip.is-on{opacity:1}

  /* 색상별 판매: 키 컬러 네 가지가 상품 색상으로 들어간다. 파스텔은 색상 칩(타일)에만 */
  .colors{flex:1;margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
  .colors li{flex:1;min-height:46px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;column-gap:12px;border-bottom:1px solid var(--grid)}
  .colors li:last-child{border-bottom:0}
  .colors i{width:34px;height:34px;border-radius:8px}
  .colors .name{display:block;font-size:13px;font-weight:700}
  .colors .hex{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .colors .num{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .colors .num small{display:block;font-size:12px;font-weight:500;color:var(--muted)}

  /* 캠페인 배너와 베스트셀러: 위에 그림, 아래에 이름 · 설명 · 수치 한 줄 */
  .feature{flex:1;display:flex;flex-direction:column;min-height:0}
  .feature__media{position:relative;flex:1;min-height:150px;border-radius:8px;overflow:hidden;background:var(--pill)}
  .feature__media img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 58%}
  .feature__name{margin:10px 0 0;font-size:13px;font-weight:700}
  .feature__meta{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .feature__meta b{font-weight:700;color:var(--ink-2)}
  .feature__meta .f-display{font-family:var(--display)}
  .feature__row{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .feature__val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .feature__tag{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700}
  .tag--orange{background:var(--k-orange)} .tag--green{background:var(--k-green)}
  /* 배너: 칠판색 바탕에 제목 서체 */
  .banner{background:var(--k-dark);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px 15px}
  .banner__dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .banner__kicker{position:absolute;top:14px;left:18px;margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;color:#C8C8C8}
  html[lang="ko"] .banner__kicker{letter-spacing:.02em}
  .banner__head{position:relative;margin:0;font-family:var(--display);font-size:34px;line-height:1;font-weight:700;letter-spacing:.01em}
  .banner__copy{position:relative;margin:7px 0 0;font-size:13px;font-weight:500;color:#C8C8C8}

  .foot{margin:18px 0 0;font-size:12px;color:var(--faint)}

  /* ---------- 임베드(?embed=1 · lib/embed.js)와 캡처(?shot=1) ---------- */
  html.vz-embed .foot{display:none}
  html.vz-shot .lang,html.vz-shot .foot{display:none}
  html.vz-shot .page{min-height:100vh;display:flex;flex-direction:column}
  html.vz-shot #panel{flex:1;display:flex;flex-direction:column}
  html.vz-shot .row-c{flex:1}
  html.vz-shot .feature__media,html.vz-shot .colors li{min-height:0}

  /* ---------- 반응형 ---------- */
  @media (max-width:960px){
    .page{padding:32px 24px 36px}
    .head h1{font-size:76px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .row-a,.row-b{grid-template-columns:minmax(0,1fr)}
    .row-c{grid-template-columns:repeat(2,minmax(0,1fr))}
    .row-c > .card:first-child{grid-column:1 / -1}
  }
  @media (max-width:600px){
    .page{padding:22px 16px 28px}
    .eyebrow{font-size:12px;letter-spacing:.16em}
    .head h1{margin-top:10px;font-size:58px;margin-left:-3px}
    .words{margin-top:12px;font-size:19px}
    .tabs{margin-top:22px}
    .kpis{gap:10px}
    .kpi{padding:14px}
    .kpi__main{gap:12px}
    .kpi__value{font-size:23px}
    .row-c{grid-template-columns:minmax(0,1fr)}
    .card{padding:16px 14px 14px}
    .bar{grid-template-columns:96px minmax(0,1fr) 48px;gap:10px}
    .feature__media{min-height:170px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <p class="eyebrow">VIZNEY STYLES · 01</p>
      <h1>CHALK</h1>
      <p class="words" data-i18n="words"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="false">KO</button>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div id="panel" role="tabpanel">
    <div class="sec-head">
      <h2 data-i18n="section"></h2>
      <span class="period" data-i18n="period"></span>
    </div>

    <section class="kpis" id="kpis"></section>

    <section class="row row-a">
      <article class="card">
        <div class="card__head">
          <h3 class="card__title"><span data-i18n="lineTitle"></span><small data-i18n="lineSub"></small></h3>
          <div class="legend">
            <button type="button" data-s="wd"><svg width="20" height="8" aria-hidden="true"><line x1="1" y1="4" x2="19" y2="4" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="wd"></span><span class="legend__val" data-lv="wd"></span></button>
            <button type="button" data-s="we"><svg width="20" height="8" aria-hidden="true"><line x1="1" y1="4" x2="19" y2="4" stroke="#478F35" stroke-width="2" stroke-dasharray="5 4"/></svg><span data-i18n="we"></span><span class="legend__val" data-lv="we"></span></button>
          </div>
        </div>
        <div class="lc" id="lc" tabindex="0" role="group">
          <svg aria-hidden="true"></svg>
          <div class="tip lc-tip" id="lcTip" aria-hidden="true">
            <div class="tip__title"></div>
            <div class="tip__row"><svg width="18" height="8"><line x1="1" y1="4" x2="17" y2="4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg><span class="tip__label" data-i18n="wd"></span><span class="tip__val" data-v="wd"></span></div>
            <div class="tip__row"><svg width="18" height="8"><line x1="1" y1="4" x2="17" y2="4" stroke="#93CC74" stroke-width="2" stroke-dasharray="4 3"/></svg><span class="tip__label" data-i18n="we"></span><span class="tip__val" data-v="we"></span></div>
          </div>
        </div>
        <p class="sr-only" id="lcLive" aria-live="polite"></p>
        <div class="sr-only" id="lcTable"></div>
      </article>

      <article class="card">
        <div class="card__head"><h3 class="card__title"><span data-i18n="ringTitle"></span></h3></div>
        <div class="gauge-body">
          <div class="ring" id="ring">
            <svg viewBox="0 0 240 196" role="img"></svg>
            <div class="ring__center"><div class="ring__label" id="ringLabel"></div><div class="ring__value" id="ringValue"></div></div>
          </div>
          <ul class="cat-legend" id="catLegend"></ul>
        </div>
        <div class="sr-only" id="ringTable"></div>
      </article>
    </section>

    <section class="row row-b">
      <article class="card">
        <div class="card__head"><h3 class="card__title" id="prodTitle"><span data-i18n="prodTitle"></span><small data-i18n="prodSub"></small></h3></div>
        <table class="tbl" aria-labelledby="prodTitle">
          <thead><tr><th scope="col"><span class="sr-only" data-i18n="rankHead"></span></th><th scope="col" data-i18n="thProduct"></th><th scope="col" class="num" data-i18n="thOrders"></th><th scope="col" class="num" data-i18n="thChange"></th></tr></thead>
          <tbody id="products"></tbody>
        </table>
      </article>

      <article class="card">
        <div class="card__head"><h3 class="card__title"><span data-i18n="chanTitle"></span><small data-i18n="chanSub"></small></h3></div>
        <ul class="bars" id="bars"></ul>
        <div class="tip bar-tip" id="barTip" aria-hidden="true"><div class="tip__title"></div><div class="tip__body"></div></div>
        <div class="sr-only" id="barTable"></div>
      </article>
    </section>

    <section class="row row-c">
      <article class="card">
        <div class="card__head"><h3 class="card__title"><span data-i18n="colorTitle"></span><small data-i18n="colorSub"></small></h3></div>
        <ul class="colors" id="colors"></ul>
      </article>

      <article class="card">
        <div class="card__head"><h3 class="card__title"><span data-i18n="promoTitle"></span><small data-i18n="promoSub"></small></h3></div>
        <div class="feature">

  function profile(spec) {
    const w = [];
    for (let h = 0; h < 24; h++) {
      let v = spec.base;
      for (const [mu, s, a] of spec.b) {
        let d = Math.abs(h + .5 - mu);
        d = Math.min(d, 24 - d);
        v += a * Math.exp(-(d * d) / (2 * s * s));
      }
      w.push(v);
    }
    const sum = w.reduce((p, c) => p + c, 0);
    return w.map(v => v / sum);

  const DATA = {};
  (function build() {

  })();

  const STR = {

  const state = { lang: new URLSearchParams(location.search).get('lang') === 'ko' ? 'ko' : 'en', ch: 'all' };

  const fmt = {

        setParts(el.value, k.f(k.cur(d), state.lang));
        const dl = change(k.cur(d), k.prev(d), k.kind, k.better);
        el.delta.className = 'delta is-' + dl.tone;
        el.dIcon.innerHTML = ARROW[dl.dir];
        el.dTxt.textContent = dl.txt;
        el.delta.setAttribute('aria-label', S().deltaAria(dl.txt, S().tone[dl.tone]));
        el.label.textContent = S().kpi[k.id];
      };
      if (animate && !REDUCE) {
        el.root.classList.add('is-swap');
        setTimeout(() => { apply(); el.root.classList.remove('is-swap'); }, 140);
      } else apply();
    }
  }

  /* ================= 시간대별 주문 (라인) ================= */
  const M = { t: 12, r: 14, b: 30, l: 34 };
  const seriesMax = d => Math.max(...d.wd, ...d.we);
  const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  const niceMax = max => { const s = niceStep(max / 5); return Math.ceil(max / s) * s; };
  const peakIndex = d => { let bi = 0, bv = -1; for (let i = 0; i < 24; i++) { const v = Math.max(d.wd[i], d.we[i]); if (v > bv) { bv = v; bi = i; } } return bi; };

  const LC = {
    el: $('#lc'), svg: $('#lc svg'), tip: $('#lcTip'),
    data: { wd: DATA.all.wd.slice(), we: DATA.all.we.slice() },
    dom: niceMax(seriesMax(DATA.all) * 1.05), pinned: peakIndex(DATA.all), hover: null, w: 0, h: 0, raf: 0
  };
  const lx = i => M.l + i * (LC.w - M.l - M.r) / 23;
  const ly = v => M.t + (1 - v / LC.dom) * (LC.h - M.t - M.b);

  // 단조 3차 보간(d3.curveMonotoneX와 같은 방식) — 곡선이 실제 값 범위를 넘지 않는다
  function monotonePath(P) {
    const n = P.length, s = [], t = new Array(n);
    for (let i = 0; i < n - 1; i++) s.push((P[i + 1][1] - P[i][1]) / (P[i + 1][0] - P[i][0]));
    for (let i = 1; i < n - 1; i++) {
      const h0 = P[i][0] - P[i - 1][0], h1 = P[i + 1][0] - P[i][0], p = (s[i - 1] * h1 + s[i] * h0) / (h0 + h1);
      t[i] = (Math.sign(s[i - 1]) + Math.sign(s[i])) * Math.min(Math.abs(s[i - 1]), Math.abs(s[i]), .5 * Math.abs(p)) || 0;
    }
    t[0] = (3 * s[0] - t[1]) / 2;
    t[n - 1] = (3 * s[n - 2] - t[n - 2]) / 2;
    const f = v => v.toFixed(2);
    let d = `M${f(P[0][0])},${f(P[0][1])}`;
    for (let i = 0; i < n - 1; i++) {
      const dx = (P[i + 1][0] - P[i][0]) / 3;
      d += `C${f(P[i][0] + dx)},${f(P[i][1] + t[i] * dx)} ${f(P[i + 1][0] - dx)},${f(P[i + 1][1] - t[i + 1] * dx)} ${f(P[i + 1][0])},${f(P[i + 1][1])}`;
    }
    return d;
  }

  function drawLine() {
    LC.w = LC.el.clientWidth; LC.h = LC.el.clientHeight;
    if (!LC.w || !LC.h) return;
    // 좁은 화면에서는 떠 있는 툴팁 대신 범례에 값을 표시해 곡선을 가리지 않는다
    LC.el.closest('.card').classList.toggle('is-narrow', LC.w < 520);
    const step = niceStep(LC.dom / 5), bottom = LC.h - M.b;
    let g = '';
    for (let v = 0; v <= LC.dom + 1e-6; v += step) {
      const y = Math.round(ly(v)) + .5;
      g += `<line x1="${M.l}" x2="${LC.w - M.r}" y1="${y}" y2="${y}" stroke="#EFEFEF"/>`;
      g += `<text class="tick" x="${M.l - 10}" y="${y}" dy=".35em" text-anchor="end">${Math.round(v)}</text>`;
    }
    for (const i of [0, 4, 8, 12, 16, 20]) g += `<text class="xtick" data-i="${i}" x="${lx(i)}" y="${LC.h - 8}" text-anchor="middle">${S().hourTick(i)}</text>`;
    g += `<text class="xtick is-active xhover" y="${LC.h - 8}" text-anchor="middle" visibility="hidden"></text>`;
    const pts = arr => arr.map((v, i) => [lx(i), ly(v)]);
    g += `<line class="xhair" y1="${M.t}" y2="${bottom}" stroke="${COLOR.ink}" stroke-width="1"/>`;
    g += `<path class="ser ser-we" d="${monotonePath(pts(LC.data.we))}" fill="none" stroke="${COLOR.green}" stroke-width="2" stroke-dasharray="6 5"/>`;
    g += `<path class="ser ser-wd" d="${monotonePath(pts(LC.data.wd))}" fill="none" stroke="${COLOR.ink}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const i of [0, 23]) g += `<circle class="endpt" cx="${lx(i)}" cy="${ly(LC.data.wd[i])}" r="4.5" fill="#fff" stroke="${COLOR.ink}" stroke-width="2"/>`;
    g += `<g class="focus"><circle class="fd-we" r="5" fill="${COLOR.green}" stroke="#fff" stroke-width="2"/><circle class="fd-wd" r="5" fill="${COLOR.ink}" stroke="#fff" stroke-width="2"/></g>`;
    LC.svg.setAttribute('viewBox', `0 0 ${LC.w} ${LC.h}`);
    LC.svg.innerHTML = g;
    drawFocus();
  }

  function drawFocus() {
    if (!LC.w) return;
    const i = LC.hover != null ? LC.hover : LC.pinned, x = lx(i);
    const xh = $('.xhair', LC.svg);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x);
    const fwd = $('.fd-wd', LC.svg), fwe = $('.fd-we', LC.svg);
    fwd.setAttribute('cx', x); fwd.setAttribute('cy', ly(LC.data.wd[i]));
    fwe.setAttribute('cx', x); fwe.setAttribute('cy', ly(LC.data.we[i]));
    let onTick = false;
    for (const t of $$('.xtick[data-i]', LC.svg)) {
      const ti = +t.dataset.i, on = ti === i;
      if (on) onTick = true;
      t.classList.toggle('is-active', on);
      t.setAttribute('visibility', !on && Math.abs(lx(ti) - x) < 40 ? 'hidden' : 'visible');
    }
    const hov = $('.xhover', LC.svg);
    if (onTick) hov.setAttribute('visibility', 'hidden');
    else { hov.textContent = S().hourTick(i); hov.setAttribute('x', x); hov.setAttribute('visibility', 'visible'); }

    const unit = S().unitCount;
    $('.tip__title', LC.tip).textContent = S().hourRange(i);
    $('[data-v="wd"]', LC.tip).textContent = LC.data.wd[i].toFixed(1) + unit;
    $('[data-v="we"]', LC.tip).textContent = LC.data.we[i].toFixed(1) + unit;
    $('[data-lv="wd"]').textContent = LC.data.wd[i].toFixed(1) + unit;
    $('[data-lv="we"]').textContent = LC.data.we[i].toFixed(1) + unit;
    const tw = LC.tip.offsetWidth;
    let left = x - tw - 12;
    if (left < M.l) left = x + 12;
    if (left + tw > LC.w) left = LC.w - tw;
    LC.tip.style.transform = `translate(${Math.round(left)}px, ${M.t}px)`;
  }

  function hourAt(clientX) {
    const r = LC.el.getBoundingClientRect();
    const i = Math.round((clientX - r.left - M.l) / ((LC.w - M.l - M.r) / 23));
    return Math.max(0, Math.min(23, i));
  }
  LC.el.addEventListener('pointermove', e => { const i = hourAt(e.clientX); if (i !== LC.hover) { LC.hover = i; drawFocus(); } });
  LC.el.addEventListener('pointerdown', e => { LC.hover = hourAt(e.clientX); drawFocus(); });
  LC.el.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse' && LC.hover != null) LC.pinned = LC.hover; });
  LC.el.addEventListener('pointerleave', () => { LC.hover = null; drawFocus(); });
  LC.el.addEventListener('keydown', e => {
    const moves = { ArrowLeft: -1, ArrowRight: 1 };
    let i = LC.pinned;
    if (e.key in moves) i = Math.max(0, Math.min(23, i + moves[e.key]));
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = 23;
    else return;
    e.preventDefault();
    LC.pinned = i; LC.hover = null; drawFocus();
    $('#lcLive').textContent = `${S().hourRange(i)} · ${S().wd} ${LC.data.wd[i].toFixed(1)}${S().unitCount}, ${S().we} ${LC.data.we[i].toFixed(1)}${S().unitCount}`;
  });
  for (const b of $$('.legend button')) {
    const on = () => LC.el.classList.add('emph-' + b.dataset.s), off = () => LC.el.classList.remove('emph-' + b.dataset.s);
    b.addEventListener('mouseenter', on); b.addEventListener('mouseleave', off);
    b.addEventListener('focus', on); b.addEventListener('blur', off);
  }
  new ResizeObserver(() => drawLine()).observe(LC.el);

  function tweenLine(ch) {
    const to = DATA[ch], from = { wd: LC.data.wd.slice(), we: LC.data.we.slice(), dom: LC.dom };
    const toDom = niceMax(seriesMax(to) * 1.05);
    LC.pinned = peakIndex(to); LC.hover = null;
    cancelAnimationFrame(LC.raf);
    if (REDUCE) { LC.data = { wd: to.wd.slice(), we: to.we.slice() }; LC.dom = toDom; drawLine(); return; }
    const t0 = performance.now(), dur = 480;
    const frame = now => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      LC.data = { wd: from.wd.map((v, i) => v + (to.wd[i] - v) * e), we: from.we.map((v, i) => v + (to.we[i] - v) * e) };
      LC.dom = from.dom + (toDom - from.dom) * e;
      drawLine();
      if (t < 1) LC.raf = requestAnimationFrame(frame);
    };
    LC.raf = requestAnimationFrame(frame);
  }

  /* ================= 카테고리별 주문 (게이지형 도넛) ================= */
  const RG = { el: $('#ring'), svg: $('#ring svg'), vals: DATA.all.cat.slice(), focus: null, raf: 0, cx: 120, cy: 112, r: 94, sw: 20, a0: -135, a1: 135, gap: 3 };
  const pt = a => { const rad = a * Math.PI / 180; return [RG.cx + RG.r * Math.sin(rad), RG.cy - RG.r * Math.cos(rad)]; };
  const arc = (a, b) => { const [x0, y0] = pt(a), [x1, y1] = pt(b); return `M${x0.toFixed(2)},${y0.toFixed(2)}A${RG.r},${RG.r} 0 ${b - a > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`; };

  function drawRing() {
    const vals = RG.vals, total = vals.reduce((p, c) => p + c, 0), n = vals.length;
    const sweep = (RG.a1 - RG.a0) - RG.gap * (n - 1);
    let a = RG.a0, segs = '', hits = '';
    vals.forEach((v, i) => {
      const b = a + (total ? v / total * sweep : 0);
      // 양 끝만 둥글게: 첫·마지막 조각에 원을 덧대고, 흐림 효과가 겹쳐 진해지지 않도록 그룹 단위로 투명도를 준다
      let cap = '';
      if (i === 0) { const [x, y] = pt(a); cap += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${RG.sw / 2}" fill="${COLOR.cats[i]}"/>`; }
      if (i === n - 1) { const [x, y] = pt(b); cap += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${RG.sw / 2}" fill="${COLOR.cats[i]}"/>`; }
      segs += `<g class="seg" data-i="${i}"><path d="${arc(a, b)}" fill="none" stroke="${COLOR.cats[i]}" stroke-width="${RG.sw}"/>${cap}</g>`;
      hits += `<path class="hit" data-i="${i}" d="${arc(a, b)}" fill="none" stroke="transparent" stroke-width="${RG.sw + 16}" style="pointer-events:stroke"/>`;
      a = b + RG.gap;
    });
    RG.svg.innerHTML = segs + hits;
    applyRingFocus();
  }
  function applyRingFocus() {
    const i = RG.focus;
    RG.el.classList.toggle('has-focus', i != null);
    for (const s of $$('.seg', RG.svg)) s.classList.toggle('is-on', +s.dataset.i === i);
    const lg = $('#catLegend');
    lg.classList.toggle('has-focus', i != null);
    $$('li', lg).forEach((li, j) => li.classList.toggle('is-on', j === i));
  }
  function renderRingText() {
    const d = DATA[state.ch], total = d.cat.reduce((p, c) => p + c, 0);
    if (RG.focus == null) {
      $('#ringLabel').textContent = S().total;
      setParts($('#ringValue'), fmt.count(total, state.lang));
    } else {
      $('#ringLabel').textContent = S().cats[RG.focus];
      setParts($('#ringValue'), fmt.rate(d.cat[RG.focus] / total));
    }
  }
  function setRingFocus(i) {
    if (RG.focus === i) return;
    RG.focus = i; applyRingFocus(); renderRingText();
  }
  const legendItems = COLOR.cats.map((c, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<button type="button"><span class="dot"></span><span class="name"></span><span class="val"></span></button>';
    $('.dot', li).style.background = c;
    const b = $('button', li);
    b.addEventListener('mouseenter', () => setRingFocus(i));
    b.addEventListener('mouseleave', () => setRingFocus(null));
    b.addEventListener('focus', () => setRingFocus(i));
    b.addEventListener('blur', () => setRingFocus(null));
    $('#catLegend').appendChild(li);
    return { name: $('.name', li), val: $('.val', li) };
  });
  function renderLegend() {
    const d = DATA[state.ch], total = d.cat.reduce((p, c) => p + c, 0);
    legendItems.forEach((it, i) => {
      it.name.textContent = S().cats[i];
      it.val.textContent = `${nf(d.cat[i])}${S().unitCount} (${(d.cat[i] / total * 100).toFixed(1)}%)`;
    });
  }
  RG.svg.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (h) setRingFocus(+h.dataset.i); });
  RG.svg.addEventListener('pointerleave', () => setRingFocus(null));

  function tweenRing(ch) {
    const to = DATA[ch].cat, from = RG.vals.slice();
    cancelAnimationFrame(RG.raf);
    if (REDUCE) { RG.vals = to.slice(); drawRing(); return; }
    const t0 = performance.now(), dur = 480;
    const frame = now => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      RG.vals = from.map((v, i) => v + (to[i] - v) * e);
      drawRing();
      if (t < 1) RG.raf = requestAnimationFrame(frame);
    };
    RG.raf = requestAnimationFrame(frame);
  }

  /* ================= 인기 상품 ================= */
  function topProducts(d) {
    return PRODUCTS.map(p => ({ id: p.id, cur: d.prod[p.id][0], prev: d.prod[p.id][1] }))
      .sort((a, b) => b.cur - a.cur).slice(0, 5);
  }
  function renderProducts() {
    const s = S();
    $('#products').innerHTML = topProducts(DATA[state.ch]).map((r, i) => {
      const c = change(r.cur, r.prev);
      return `<tr><td class="rank">${String(i + 1).padStart(2, '0')}</td><th scope="row" class="name">${s.products[r.id]}</th>` +
        `<td class="num">${nf(r.cur)}</td><td class="num"><span class="chg is-${c.tone}" aria-label="${s.deltaAria(c.txt, s.tone[c.tone])}">${arrowSvg(c.dir)}${c.txt}</span></td></tr>`;
    }).join('');
  }

  /* ================= 채널별 매출 ================= */
  const BAR_CH = CHANNELS.slice(1);
  const barEls = BAR_CH.map(ch => {
    const li = document.createElement('li');
    li.className = 'bar'; li.tabIndex = 0; li.dataset.ch = ch;
    li.innerHTML = '<span class="bar__name"></span><span class="bar__track" aria-hidden="true"><span class="bar__fill" style="display:block;width:0"></span></span><span class="bar__val"></span>';
    $('#bars').appendChild(li);
    const show = () => showBarTip(li), hide = () => $('#barTip').classList.remove('is-on');
    li.addEventListener('pointerenter', show); li.addEventListener('pointerleave', hide);
    li.addEventListener('focus', show); li.addEventListener('blur', hide);
    return { li, name: $('.bar__name', li), fill: $('.bar__fill', li), val: $('.bar__val', li) };
  });
  function renderBars() {
    const s = S(), revs = BAR_CH.map(k => DATA[k].rev[0]);
    const tot = revs.reduce((p, c) => p + c, 0), mx = Math.max(...revs);
    barEls.forEach((b, i) => {
      const ch = BAR_CH[i], share = (revs[i] / tot * 100).toFixed(1) + '%';
      b.name.textContent = s.tabs[ch];
      b.val.textContent = share;
      b.fill.style.width = (revs[i] / mx * 100).toFixed(1) + '%';
      b.li.classList.toggle('is-dim', state.ch !== 'all' && state.ch !== ch);
      b.li.setAttribute('aria-label', `${s.tabs[ch]}: ${revText(revs[i], state.lang)}, ${share}`);
    });
  }
  function showBarTip(li) {
    const s = S(), ch = li.dataset.ch, d = DATA[ch], tip = $('#barTip');
    const c = change(d.rev[0], d.rev[1]);
    $('.tip__title', tip).textContent = s.tabs[ch];
    $('.tip__body', tip).textContent = s.barTip(revText(d.rev[0], state.lang), c.txt);
    const card = li.closest('.card'), cr = card.getBoundingClientRect(), fr = $('.bar__fill', li).getBoundingClientRect();
    tip.classList.add('is-on');
    let left = fr.right - cr.left - tip.offsetWidth / 2;
    left = Math.max(12, Math.min(cr.width - tip.offsetWidth - 12, left));
    const top = fr.top - cr.top - tip.offsetHeight - 10;
    tip.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
  }

  /* ================= 색상별 판매 · 캠페인 · 베스트셀러 ================= */
  function renderColors() {
    const s = S(), n = DATA[state.ch].colors, tot = n.reduce((p, c) => p + c, 0);
    $('#colors').innerHTML = COLORS.map((c, i) =>
      `<li><i style="background:${c.hex}" aria-hidden="true"></i><span><span class="name">${s.colors[c.id]}</span><span class="hex">${c.hex}</span></span>` +
      `<span class="num">${nf(n[i])}${s.colorUnit ? `<span class="u">${s.colorUnit}</span>` : ''}<small>${(n[i] / tot * 100).toFixed(1)}%</small></span></li>`).join('');
  }
  function renderFeatures() {
    const s = S(), d = DATA[state.ch];
    $('#promoFonts').innerHTML = s.promoFonts;
    $('#promoVal').innerHTML = s.promoVal(d.promo);
    $('#bestMeta').textContent = s.bestMeta(d.prod.chalk[0]);
    setParts($('#bestPrice'), fmt.won(PRICE, state.lang));
    $('#bestImg').alt = s.bestAlt;
  }

  /* ================= 스크린 리더용 표 ================= */
  function table(caption, head, rows) {
    const t = document.createElement('table'), cap = document.createElement('caption');
    cap.textContent = caption; t.appendChild(cap);
    const tr = document.createElement('tr');
    for (const h of head) { const th = document.createElement('th'); th.scope = 'col'; th.textContent = h; tr.appendChild(th); }
    const thead = document.createElement('thead'); thead.appendChild(tr); t.appendChild(thead);
    const tb = document.createElement('tbody');
    for (const r of rows) {
      const row = document.createElement('tr');
      r.forEach((c, j) => { const cell = document.createElement(j ? 'td' : 'th'); if (!j) cell.scope = 'row'; cell.textContent = c; row.appendChild(cell); });
      tb.appendChild(row);
    }
    t.appendChild(tb);
    return t;
  }
  function renderTables() {
    const d = DATA[state.ch], s = S(), total = d.cat.reduce((p, c) => p + c, 0);
    $('#lcTable').replaceChildren(table(`${s.lineTitle} (${s.lineSub}) · ${s.tabs[state.ch]}`, [s.hourHead, s.wd, s.we],
      d.wd.map((v, i) => [s.hourRange(i), v.toFixed(1), d.we[i].toFixed(1)])));
    $('#ringTable').replaceChildren(table(`${s.ringTitle} · ${s.tabs[state.ch]}`, [s.catHead, s.ordHead, s.shareHead],
      d.cat.map((v, i) => [s.cats[i], nf(v), (v / total * 100).toFixed(1) + '%'])));
    const revs = BAR_CH.map(k => DATA[k].rev[0]), tot = revs.reduce((p, c) => p + c, 0);
    $('#barTable').replaceChildren(table(s.chanTitle, [s.chanHead, s.revHead, s.shareHead, s.chgHead],
      BAR_CH.map((k, i) => [s.tabs[k], revText(revs[i], state.lang), (revs[i] / tot * 100).toFixed(1) + '%', change(DATA[k].rev[0], DATA[k].rev[1]).txt])));
  }

  /* ================= 채널 탭 ================= */
  const tabsEl = $('#tabs');
  for (const ch of CHANNELS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.id = 'tab-' + ch; b.dataset.ch = ch;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'panel');
    b.addEventListener('click', () => selectChannel(ch));
    tabsEl.appendChild(b);
  }
  function syncTabs() {
    for (const b of $$('.tab', tabsEl)) {
      const on = b.dataset.ch === state.ch;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    }
    $('#panel').setAttribute('aria-labelledby', 'tab-' + state.ch);
  }
  tabsEl.addEventListener('keydown', e => {
    const idx = CHANNELS.indexOf(state.ch);
    const next = { ArrowRight: idx + 1, ArrowLeft: idx - 1, Home: 0, End: CHANNELS.length - 1 }[e.key];
    if (next == null) return;
    e.preventDefault();
    const ch = CHANNELS[(next + CHANNELS.length) % CHANNELS.length];
    selectChannel(ch);
    $('#tab-' + ch).focus();
  });
  function renderCards() {
    renderProducts(); renderBars(); renderColors(); renderFeatures(); renderTables();
  }
  function selectChannel(ch) {
    if (ch === state.ch) return;
    state.ch = ch;
    syncTabs();
    renderKpis(true);
    tweenLine(ch);
    RG.focus = null;
    tweenRing(ch);
    renderRingText();
    renderLegend();
    renderCards();
  }

  /* ================= 언어 ================= */
  function applyStatic() {
    const s = S();
    document.documentElement.lang = state.lang;
    document.title = s.docTitle;
    for (const el of $$('[data-i18n]')) el.textContent = pick(s, el.dataset.i18n);
    for (const b of $$('.tab', tabsEl)) b.textContent = s.tabs[b.dataset.ch];
    tabsEl.setAttribute('aria-label', s.tablist);
    LC.el.setAttribute('aria-label', s.lineAria);
    RG.svg.setAttribute('aria-label', s.ringAria);
    for (const b of $$('.lang button')) b.setAttribute('aria-pressed', b.dataset.lang === state.lang ? 'true' : 'false');
  }
  function setLang(lang) {
    state.lang = lang;
    applyStatic();
    renderKpis(false);
    drawLine();
    renderRingText();
    renderLegend();
    renderCards();
  }
  for (const b of $$('.lang button')) b.addEventListener('click', () => { if (b.dataset.lang !== state.lang) setLang(b.dataset.lang); });

  syncTabs();
  drawRing();
  setLang(state.lang);
  // 글꼴이 늦게 오면 글자 폭이 바뀌므로 차트를 한 번 더 그린다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawLine());
})();
</script>
</body>
</html>
